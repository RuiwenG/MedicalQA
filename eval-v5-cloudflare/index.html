function setSourceUnverifiable(unavailable) {
  const state = metricState(S.uids[S.index], "qa_alignment");
  state.sourceUnverifiable = unavailable === true;
  const metric = METRICS.find((m) => m.key === "qa_alignment");
  const block = app.querySelector('.metric[data-key="qa_alignment"]');
  if (block) {
    block.querySelector("[data-trust-controls]").hidden = state.sourceUnverifiable;
    block.classList.toggle("rated", completeOnScreen(state, metric));
    if (state.sourceUnverifiable && dictation && block.contains(dictation.ta)) stopDictation();
  }
  const status = document.getElementById("source-not-assessed");
  if (status) status.hidden = !state.sourceUnverifiable;
  setRateErr("");
  save();
}

function setMetricField(key, field, value) {
  const uid = S.uids[S.index];
  const state = metricState(uid, key);
  state[field] = value;
  const metric = METRICS.find((m) => m.key === key);
  const block = app.querySelector('.metric[data-key="' + key + '"]');
  if (block) {
    block.classList.toggle("rated", completeOnScreen(state, metric));
    block.querySelectorAll('[data-field="' + field + '"]').forEach((b) => {
      b.classList.toggle("sel", b.dataset.value === String(value));
    });
    if (field === "attribute" && metric && metric.optionalIssues) {
      const errorPanel = block.querySelector(".error-panel");
      if (errorPanel) errorPanel.hidden = false;
    }
  }
  setRateErr("");
  save();
}

function setBinaryDecision(key, value) {
  const uid = S.uids[S.index];
  const state = metricState(uid, key);
  state.binary = value;
  delete state.severity;
  const metric = METRICS.find((m) => m.key === key);
  if (value === clearChoice(metric) && metric) {
    state.errors = [];
    delete state.otherText;
    state.error = metric.noIssueError;
  } else if (value === errorTrigger(metric) && state.error === (metric && metric.noIssueError)) {
    state.errors = [];
    delete state.error;
  }

  const block = app.querySelector('.metric[data-key="' + key + '"]');
  if (block) {
    block.classList.toggle("rated", completeOnScreen(state, metric));
    block.querySelectorAll("[data-choice]").forEach((b) => {
      b.classList.toggle("sel", b.dataset.choice === value);
    });
    const errorPanel = block.querySelector(".error-panel");
    if (errorPanel) errorPanel.hidden = value !== errorTrigger(metric);
    block.querySelectorAll("[data-error]").forEach((b) => b.classList.toggle("sel", selectedErrors(state.errors || state.error).includes(b.dataset.error)));
  }
  setRateErr("");
  // Question 1 is answered without the video; once it has an answer, show the video.
  if (METRICS_BEFORE_VIDEO.includes(key)) {
    const videoPanel = document.getElementById("source-video-panel");
    if (videoPanel && !videoPanel.open) videoPanel.open = true;
  }
  save();
  if (value === errorTrigger(metric) && !completeOnScreen(state, metric)) {
    setRateErr(metric && metric.errorTrigger === "Yes"
      ? "You chose Yes. Please pick at least one concern."
      : "You chose No. Please pick at least one problem.");
  }
}

function toggleMetricError(key, label) {
  const uid = S.uids[S.index];
  const state = metricState(uid, key);
  const errors = selectedErrors(state.errors || state.error);
  const metricDef = METRICS.find((m) => m.key === key);
  const none = metricDef && metricDef.optionalIssues ? metricDef.noIssueError : null;
  const idx = errors.indexOf(label);
  if (idx === -1) {
    if (none && label === none) errors.length = 0;          // "No issue" clears the problems
    else if (none) { const n = errors.indexOf(none); if (n !== -1) errors.splice(n, 1); }
    errors.push(label);
  } else errors.splice(idx, 1);
  if (none && label === none) delete state.otherText;
  state.errors = errors;
  delete state.error;
  const metric = METRICS.find((m) => m.key === key);

  const block = app.querySelector('.metric[data-key="' + key + '"]');
  if (block) {
    block.classList.toggle("rated", completeOnScreen(state, metric));
    block.querySelectorAll("[data-error]").forEach((b) => {
      b.classList.toggle("sel", errors.includes(b.dataset.error));
    });
    const otherBox = block.querySelector(".other-box");
    if (otherBox && metric && metric.otherOption) {
      const on = errors.includes(metric.otherOption);
      otherBox.hidden = !on;
      if (!on && dictation && otherBox.contains(dictation.ta)) stopDictation();
      if (on && label === metric.otherOption) otherBox.querySelector("textarea").focus();
    }
  }
  setRateErr(otherIncomplete(state, metric) ? "Please describe the problem in the Other box." : "");
  save();
}

/* ===========================================================================
   Dictation (speech to text) for every text box
   ===========================================================================
   Uses the browser's built-in speech recognition (Chrome, Edge, Safari). In
   browsers without it (Firefox) no mic button is shown. Spoken text is added
   at the end of what is already in the box and goes through the box's normal
   "input" handler, so it is saved exactly like typed text. */
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
const MIC_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg>';
let dictation = null;  // { rec, ta, btn, status }

function stopDictation() {
  if (!dictation) return;
  const d = dictation;
  dictation = null;
  try { d.rec.stop(); } catch (e) { /* already stopped */ }
  d.btn.classList.remove("on");
  d.btn.setAttribute("aria-pressed", "false");
  d.btn.title = "Dictate with your microphone";
  if (d.status.textContent === "Listening… speak now, click the mic again to stop.") d.status.textContent = "";
}

function startDictation(ta, btn, status) {
  stopDictation();
  const rec = new SpeechRec();
  rec.lang = navigator.language || "en-US";
  rec.continuous = true;
  rec.interimResults = true;
  // Text already in the box stays; dictated phrases are appended after it.
  let base = ta.value;
  const join = (a, b) => (a && b && !/\s$/.test(a) ? a + " " : a) + b;
  rec.onresult = (ev) => {
    let interim = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const text = ev.results[i][0].transcript.trim();
      if (ev.results[i].isFinal) base = join(base, text);
      else interim = join(interim, text);
    }
    ta.value = join(base, interim);
    ta.dispatchEvent(new Event("input", { bubbles: true }));
  };
  rec.onerror = (ev) => {
    status.textContent = ev.error === "not-allowed" || ev.error === "service-not-allowed"
      ? "The microphone is blocked. Allow it in the address bar, or type instead."
      : ev.error === "no-speech" ? "No speech heard. Click the mic and try again." : "Dictation stopped (" + ev.error + ").";
  };
  rec.onend = () => { if (dictation && dictation.rec === rec) stopDictation(); };
  dictation = { rec, ta, btn, status };
  btn.classList.add("on");
  btn.setAttribute("aria-pressed", "true");
  btn.title = "Stop dictation";
  status.textContent = "Listening… speak now, click the mic again to stop.";
  try { rec.start(); } catch (e) { stopDictation(); status.textContent = "Could not start dictation. Type instead."; }
}

// Wraps every textarea under root with a mic button. Safe to call after each render.
function attachMics(root) {
  if (!SpeechRec) return;
  root.querySelectorAll("textarea").forEach((ta) => {
    if (ta.closest(".dictate")) return;
    const wrap = document.createElement("div");
    wrap.className = "dictate";
    ta.parentNode.insertBefore(wrap, ta);
    wrap.appendChild(ta);
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "mic-btn";
    btn.innerHTML = MIC_SVG;
    btn.title = "Dictate with your microphone";
    btn.setAttribute("aria-label", "Dictate into this box");
    btn.setAttribute("aria-pressed", "false");
    wrap.appendChild(btn);
    const status = document.createElement("div");
    status.className = "mic-status";
    status.setAttribute("aria-live", "polite");
    wrap.insertAdjacentElement("afterend", status);
    btn.addEventListener("click", () => {
      if (dictation && dictation.btn === btn) stopDictation();
      else { status.textContent = ""; startDictation(ta, btn, status); }
    });
  });
}

function setOtherText(key, text) {
  const uid = S.uids[S.index];
  const state = metricState(uid, key);
  state.otherText = text;
  const metric = METRICS.find((m) => m.key === key);
  const block = app.querySelector('.metric[data-key="' + key + '"]');
  if (block) block.classList.toggle("rated", completeOnScreen(state, metric));
  if (text.trim()) setRateErr("");
  save();
}

function setRecommendation(value) {
  const uid = S.uids[S.index];
  S.recommendations[uid] = value;
  const block = document.getElementById("recommendation");
  if (block) {
    block.classList.toggle("rated", completeRecommendation(value));
    block.querySelectorAll("[data-recommend-v]").forEach((b) => {
      b.classList.toggle("sel", b.dataset.recommendV === value);
    });
  }
  setRateErr("");
  save();
}

function setComment(value) {
  const uid = S.uids[S.index];
  if (!S.comments) S.comments = {};
  S.comments[uid] = value;
  save();
}

function advanceMetric() {
  const uid = S.uids[S.index];
  const sc = S.scores[uid] || {};
  const metrics = displayMetrics();
  const current = metrics[activeMetric];
  if (current && !completeOnScreen(sc[current.key], current)) {
    paintActive();
    return;
  }
  if (activeMetric === metrics.length - 1) {
    paintActive();
    return;
  }
  const nextUnrated = metrics.findIndex((m, i) => i > activeMetric && !completeOnScreen(sc[m.key], m));
  if (nextUnrated !== -1) {
    activeMetric = nextUnrated;
  } else {
    const anyUnrated = metrics.findIndex((m) => !completeOnScreen(sc[m.key], m));
    if (anyUnrated !== -1) activeMetric = anyUnrated;
    else {
      paintActive();
      return;
    }
  }
  paintActive();
}

function storeTime() {
  const uid = S.uids[S.index];
  if (shownAt) S.seconds[uid] = (S.seconds[uid] || 0) + Math.round((Date.now() - shownAt) / 1000);
  shownAt = Date.now();
}

function submitPair() {
  const uid = S.uids[S.index];
  const sc = S.scores[uid] || {};
  const missing = displayMetrics().filter((m) => !completeOnScreen(sc[m.key], m));
  if (missing.length) {
    setRateErr("Still to answer: " + missing.map((m) =>
      otherIncomplete(sc[m.key] || {}, m) ? qNum(m.key) + " (describe the problem in the Other box)"
      : issueMissing(sc[m.key], m) && completeMetric(sc[m.key], m) ? qNum(m.key) + " (is there an issue? Pick “No issue” if there is none)"
      : qNum(m.key)).join(", ") + ".");
    const first = displayMetrics().findIndex((m) => m.key === missing[0].key);
    activeMetric = first;
    if (stepperOn()) { phoneStep = first; applyStep(true); }
    paintActive();
    const el = app.querySelector('.metric[data-mi="' + first + '"]');
    if (el) el.scrollIntoView({ block: "center", behavior: "smooth" });
    return;
  }
  if (!completeRecommendation(S.recommendations && S.recommendations[uid])) {
    setRateErr("Still to answer: question " + (displayMetrics().length + 1) + ".");
    if (stepperOn()) { phoneStep = displayMetrics().length; applyStep(false); }
    const recommendation = document.getElementById("recommendation");
    if (recommendation) recommendation.scrollIntoView({ block: "center", behavior: "smooth" });
    return;
  }
  storeTime();
  enqueue(uid);
  S.index += 1;
  save();
  renderRate();
}

// Error text under Submit, mirrored under the phone Back/Next buttons.
function setRateErr(text) {
  for (const id of ["rate-err", "step-err"]) {
    const el = document.getElementById(id);
    if (el) el.textContent = text;
  }
}

/* ---------------------------------------------------------------------------
   "?" help next to each question (display only). Opens on hover, focus or
   tap; a click/tap keeps it open; Escape or a click elsewhere closes it.
   --------------------------------------------------------------------------- */
function hintHtml(id, hint, labelFor, number) {
  if (!hint) return "";
  return `<button type="button" class="hint-btn" aria-expanded="false" aria-controls="hint-${id}" aria-label="Help with question ${number}">?</button>
            <div class="hint-pop" id="hint-${id}" role="region" aria-label="Help with question ${number}" hidden>
              <p>${escapeAttr(hint.about)}</p>
              <dl>${Object.entries(hint.levels).map(([value, text]) => `<dt>${escapeAttr(labelFor(value))}</dt><dd>${escapeAttr(text)}</dd>`).join("")}</dl>
            </div>`;
}

function setHint(btn, open) {
  const pop = document.getElementById(btn.getAttribute("aria-controls"));
  if (!pop) return;
  if (open) app.querySelectorAll('.hint-btn[aria-expanded="true"]').forEach((b) => { if (b !== btn) setHint(b, false); });
  else delete btn.dataset.pinned;
  btn.setAttribute("aria-expanded", open ? "true" : "false");
  pop.hidden = !open;
}

function bindHints(root) {
  root.querySelectorAll(".hint-btn").forEach((btn) => {
    const pop = document.getElementById(btn.getAttribute("aria-controls"));
    const head = btn.parentNode;
    let leaveTimer = null;
    const hover = (e) => e.pointerType === "mouse";
    head.addEventListener("pointerover", (e) => {
      if (!hover(e) || !(e.target === btn || pop.contains(e.target))) return;
      clearTimeout(leaveTimer);
      setHint(btn, true);
    });
    head.addEventListener("pointerout", (e) => {
      if (!hover(e) || head.contains(e.relatedTarget)) return;
      clearTimeout(leaveTimer);
      leaveTimer = setTimeout(() => { if (!btn.dataset.pinned && document.activeElement !== btn) setHint(btn, false); }, 200);
    });
    btn.addEventListener("focus", () => setHint(btn, true));
    btn.addEventListener("blur", (e) => { if (!head.contains(e.relatedTarget)) setHint(btn, false); });
    // A tap focuses the button (opening it) and then clicks: the click pins it
    // open. A second click closes it.
    btn.addEventListener("click", () => {
      if (btn.dataset.pinned) { setHint(btn, false); return; }
      setHint(btn, true);
      btn.dataset.pinned = "1";
    });
  });
}

document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  const open = app.querySelector('.hint-btn[aria-expanded="true"]');
  if (open) setHint(open, false);
});
document.addEventListener("click", (e) => {
  app.querySelectorAll('.hint-btn[aria-expanded="true"]').forEach((btn) => {
    if (!btn.parentNode.contains(e.target)) setHint(btn, false);
  });
});

/* ---------------------------------------------------------------------------
   Phones: one question at a time. Display only — the cards, answers and
   Submit & next are the same as on a computer; CSS hides the other steps.
   Steps 0..n-1 are the display metrics, step n is the recommendation.
   --------------------------------------------------------------------------- */
const PHONE = window.matchMedia ? window.matchMedia("(max-width: 620px)") : null;
let phoneStep = 0;
function stepperOn() {
  return Boolean(PHONE && PHONE.matches && app.querySelector && app.querySelector(".rating-form"));
}

// Plain words for what a question still needs before Next.
function whatIsMissing(value, metric) {
  const v = value || {};
  if (otherIncomplete(v, metric)) return "Please describe the problem in the Other box.";
  if (hasAttributeScale(metric) && !isSourceUnverifiable(v, metric) && !v.attribute) return "Please choose an answer first.";
  if (issueMissing(v, metric)) return "Please say if there is an issue. Pick “No issue” if there is none.";
  if (!metric.optionalIssues && !completeBinary(binaryValue(v))) return "Please choose Yes or No first.";
  if (!metric.optionalIssues && needsErrorSelection(v, metric)) {
    return metric.errorTrigger === "Yes" ? "Please pick at least one concern." : "Please pick at least one problem.";
  }
  return "Please answer this question first.";
}

function applyStep(scroll) {
  const form = app.querySelector && app.querySelector(".rating-form");
  if (!form) return;
  const on = Boolean(PHONE && PHONE.matches);
  form.classList.toggle("stepper", on);
  const last = displayMetrics().length;
  phoneStep = Math.max(0, Math.min(last, phoneStep));
  form.querySelectorAll("[data-step]").forEach((el) => {
    el.classList.toggle("step-off", Number(el.dataset.step) !== phoneStep);
  });
  document.getElementById("step-count").textContent = "Question " + (phoneStep + 1) + " of " + (last + 1);
  const back = document.getElementById("step-back");
  back.textContent = phoneStep === 0 ? "← Previous Q&A" : "← Back";
  back.disabled = phoneStep === 0 && S.index === 0;
  document.getElementById("step-next").hidden = phoneStep === last;
  if (on && scroll) {
    const card = form.querySelector('[data-step="' + phoneStep + '"]');
    if (card) card.scrollIntoView({ block: "start", behavior: "smooth" });
  }
}

function goToStep(step) {
  setRateErr("");
  phoneStep = step;
  activeMetric = Math.min(step, displayMetrics().length - 1);
  applyStep(true);
  paintActive();
}

function stepNext() {
  const metrics = displayMetrics();
  const m = metrics[phoneStep];
  if (m) {
    const value = (S.scores[S.uids[S.index]] || {})[m.key];
    if (!completeOnScreen(value, m)) {
      setRateErr(whatIsMissing(value, m));
      return;
    }
  }
  goToStep(Math.min(phoneStep + 1, metrics.length));
}

function stepBack() {
  if (phoneStep > 0) return goToStep(phoneStep - 1);
  const prev = document.getElementById("prev");
  if (prev && !prev.disabled) prev.click();
}

if (PHONE) {
  const onChange = () => { if (S && app.querySelector(".rating-form")) { applyStep(false); paintActive(); } };
  if (PHONE.addEventListener) PHONE.addEventListener("change", onChange);
  else if (PHONE.addListener) PHONE.addListener(onChange);
}

// Rating is by mouse or touch only: there are no keyboard shortcuts (Y, N, Enter).

/* ===========================================================================
   Screen: done
   =========================================================================== */

function renderDone() {
  releaseSourcePlayer();
  const done = ratedCount();
  const complete = done === S.uids.length;

  app.innerHTML = `
    <div class="banner ${complete ? "banner-ok" : "banner-info"}">
      ${complete
        ? "<b>All done. Thank you!</b> You rated all your Q&As."
        : "<b>Your work is saved.</b> You rated " + done + " of " + S.uids.length + " Q&As. To finish, come back to this link and type the same name."}
    </div>

    <div class="card">
      <h2>Your progress</h2>
      <table>
        <tr><td>Name</td><td><b>${escapeAttr(S.annotator)}</b></td></tr>
        <tr><td>Q&As done</td><td class="num"><b>${done}</b> of ${S.uids.length}</td></tr>
      </table>
      <div class="sync" id="sync" style="margin-top:12px;"></div>
      ${backendOn ? '<p class="muted" style="margin-top:8px;">Your ratings go to the research team on their own. You do not need to download anything.</p>' : '<p class="muted" style="margin-top:8px;">Your ratings are only in this browser. <b>Please download them and send the file to the research team.</b></p>'}

      <div class="navbtns">
        <button class="${backendOn ? "btn-ghost" : "btn-primary"}" id="dl-csv">Download a copy (spreadsheet)</button>
        <button class="btn-ghost" id="dl-json">Download a copy (data file)</button>
        ${done < S.uids.length ? '<button class="btn-ghost" id="resume">Continue rating</button>' : ""}
        <span class="spacer"></span>
        <button class="btn-ghost" id="restart">Start over with a different name</button>
      </div>
    </div>`;

  document.getElementById("dl-csv").addEventListener("click", exportCsv);
  document.getElementById("dl-json").addEventListener("click", exportJson);
  const resume = document.getElementById("resume");
  if (resume) resume.addEventListener("click", () => {
    const next = S.uids.findIndex((u) => !isRated(u));
    S.index = next === -1 ? S.uids.length : next;
    renderRate();
  });
  document.getElementById("restart").addEventListener("click", () => {
    if (S.queue.length && !confirm("Some ratings have not been sent yet. Press OK to leave anyway, or Cancel to stay and download them first.")) return;
    S = null;
    renderWelcome();
  });
  setSync(syncState);
  flush();
  window.scrollTo({ top: 0 });
}

/* ===========================================================================
   Boot
   =========================================================================== */

const loadJson = (file) => fetch(file).then((r) => {
  if (!r.ok) throw new Error(file + ": HTTP " + r.status);
  return r.json();
});
Promise.all([loadJson("qa_data.json"), loadJson("versions.json"), loadJson("transcripts.json").catch(() => ({}))])
  .then(([json, versions, transcripts]) => {
    const all = Array.isArray(json) ? json : (json.pairs || []);
    // Hard exclusion happens here, once, before anything else sees the corpus.
    DATA = all.filter((p) => !isExcluded(p.approach));
    VIDEOS = Array.isArray(json) ? {} : (json.videos || {});
    TRANSCRIPTS = transcripts && typeof transcripts === "object" ? transcripts : {};
    VERSIONS = versions.versions || {};
    PROVISIONAL = versions.provisional === true;
    if (PROVISIONAL) console.warn("v5: PROVISIONAL placeholder Q&A selection — testing only.");
    const known = new Set(DATA.map((p) => p.uid));
    const missing = Object.values(VERSIONS).flat().filter((u) => !known.has(u));
    // Versions come in batches of five (1-5, then 6-10, ...), numbered from 1.
    const numbers = Object.keys(VERSIONS).map(Number).sort((a, b) => a - b);
    const wholeBatches = numbers.length > 0 && numbers.length % 5 === 0 && numbers.every((n, i) => n === i + 1);
    const groups = Object.values(VERSIONS);
    const perGroup = versions.pairs_per_version || (groups[0] || []).length;
    const allUids = groups.flat();
    const completeGroups = Number.isInteger(perGroup) && perGroup > 0 && perGroup <= 20 &&
      groups.every((uids) => Array.isArray(uids) && uids.length === perGroup) &&
      new Set(allUids).size === allUids.length;
    if (!wholeBatches || !completeGroups || missing.length) {
      app.innerHTML = '<div class="card"><h2>Sorry, this page is not ready yet</h2>' +
        '<p>Please contact the research team.</p>' +
        '<details class="more-details"><summary>Details for the research team</summary>' +
        '<p class="muted">The Q&amp;A versions are incomplete. Rebuild them with <code>python eval-v5-netlify/build_versions.py</code>.</p></details></div>';
      return;
    }
    renderWelcome();
  })
  .catch((e) => {
    app.innerHTML = '<div class="card"><h2>Sorry, the Q&As did not load</h2>' +
      '<p>Please check your internet and reload the page. If it still does not work, contact the research team.</p>' +
      '<details class="more-details"><summary>Details for the research team</summary>' +
      '<p class="muted">' + escapeAttr(String(e)) + '</p>' +
      '<p class="muted">Rebuild the data files with <code>python eval-v5-netlify/build_versions.py</code>, and serve this folder over HTTP ' +
      '(<code>python -m http.server</code>) rather than opening the file directly — <code>file://</code> blocks the fetch.</p></details></div>';
  });
</script>
</body>
