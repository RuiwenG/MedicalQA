<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<title>Rate Dementia Care Q&amp;As — v6</title>
<style>
  :root {
    color-scheme: light;
    --navy: #1e3a5f;
    --navy-2: #2c4d7a;
    --welcome-action: #205f96;
    --ink: #1a1f2e;
    --muted: #4d5668;
    --text-2: #3b4455;
    --line: #e3e7ee;
    --bg: #f7f8fb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: var(--bg);
    font-size: 16px;
    line-height: 1.55;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 20px; }

  header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%);
    color: white;
    padding: 18px 24px;
    border-radius: 10px;
    margin-bottom: 16px;
  }
  header h1 { margin: 0 0 4px 0; font-size: 18px; font-weight: 600; letter-spacing: 0.2px; }
  header h1 { font-size: 20px; }
  header .sub { font-size: 15px; }
  .evaluation-header { background: transparent; color: var(--ink); padding: 0; border-radius: 0; margin-bottom: 6px; }
  .evaluation-header h1 { font-size: 1.65rem; font-weight: 700; letter-spacing: normal; }
  .evaluation-header p { margin: 4px 0 0; color: var(--muted); font-size: .94rem; }
  .wrap:has(.evaluation-header) > .study-header { display: none; }

  .card {
    background: white;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }
  h2 { font-size: 18px; margin: 0 0 10px 0; color: var(--navy); }
  h3 { font-size: 14px; margin: 18px 0 8px 0; color: var(--navy); text-transform: uppercase; letter-spacing: 0.5px; }
  p { margin: 0 0 10px 0; }
  .muted { color: var(--muted); font-size: 15px; }
  ul { margin: 0 0 10px 0; padding-left: 20px; }
  li { margin-bottom: 4px; }

  label.field, legend.field { display: block; font-weight: 600; font-size: 16px; margin-bottom: 5px; }
  input[type=text], input[type=number], textarea {
    font-family: inherit; font-size: 16px;
    padding: 9px 12px; border: 1px solid #d6dae3; border-radius: 8px;
    background: white; color: var(--ink);
  }
  input[type=text], input[type=number] { width: 100%; max-width: 340px; }
  textarea { width: 100%; box-sizing: border-box; min-height: 96px; resize: vertical; line-height: 1.45; }
  input[type=text]:focus, input[type=number]:focus, textarea:focus { outline: 2px solid #6b8cae; outline-offset: -1px; }

  .more-details { margin: 4px 0 14px; }
  .more-details summary { cursor: pointer; color: var(--navy); font-weight: 600; font-size: 15px; padding: 6px 0; }
  .more-details ul { margin-top: 8px; }
  .welcome-time {
    margin: 20px 0 28px;
    padding: 14px 16px;
    border-radius: 10px;
    background: #edf4fc;
    line-height: 1.6;
  }
  .annotator-profile, .welcome-actions { max-width: 620px; }
  .annotator-profile { margin-top: 18px; }
  .profile-field { margin-bottom: 15px; }
  .profile-field[hidden] { display: none; }
  .profile-field select {
    appearance: none;
    width: 100%; min-width: 0; min-height: 44px; padding: 9px 40px 9px 12px;
    font-family: inherit; font-size: 16px; color: var(--ink); background: white;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
      linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 21px) center, calc(100% - 16px) center;
    background-size: 5px 5px; background-repeat: no-repeat;
    border: 1px solid #d6dae3; border-radius: 8px;
  }
  @media (forced-colors: active) {
    .profile-field select { appearance: auto; background-image: none; }
  }
  .profile-field select:focus { outline: 2px solid #6b8cae; outline-offset: -1px; }
  .profile-field .muted { margin: 0 0 6px; }
  .profile-field input[type=text] { max-width: none; min-height: 44px; }
  .role-choices { border: 0; padding: 0; margin: 0 0 15px; min-width: 0; }
  .role-choices legend { padding: 0; }
  .role-choice { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 4px 0; cursor: pointer; }
  .role-choice input { width: 20px; height: 20px; margin: 0; flex: none; accent-color: var(--welcome-action); }
  .role-detail { margin: 0 0 8px; }
  .role-detail[hidden] { display: none; }
  .role-detail label { display: block; margin-bottom: 4px; }
  @media (pointer: coarse) {
    .profile-field select, .profile-field input[type=text] { font-size: 16px; }
  }

  /* Dictation: a mic button inside the bottom-right corner of each text box. */
  .dictate { position: relative; }
  .dictate textarea { padding-right: 48px; }
  .mic-btn {
    position: absolute; right: 8px; bottom: 10px; width: 34px; height: 34px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 50%; background: white; border: 1px solid #d6dae3; color: var(--navy);
  }
  .mic-btn:hover { border-color: #6b8cae; }
  .mic-btn svg { width: 16px; height: 16px; }
  .mic-btn.on { background: #c0392b; border-color: #c0392b; color: white; animation: mic-pulse 1.2s ease-in-out infinite; }
  @keyframes mic-pulse { 50% { box-shadow: 0 0 0 6px rgba(192, 57, 43, 0.18); } }
  @media (prefers-reduced-motion: reduce) { .mic-btn.on { animation: none; } }
  .mic-status { font-size: 14px; color: var(--muted); margin-top: 4px; min-height: 1em; }

  button {
    font-family: inherit; font-size: 16px; font-weight: 500;
    min-height: 44px; padding: 10px 20px; border-radius: 8px; border: 1px solid transparent;
    cursor: pointer; transition: background 0.15s, border-color 0.15s;
  }
  .btn-primary { background: var(--navy); color: white; }
  .btn-primary:hover { background: var(--navy-2); }
  .btn-primary:disabled { background: #9aa4b5; cursor: not-allowed; }
  button:focus-visible, summary:focus-visible { outline: 3px solid #2c5aa0; outline-offset: 2px; }
  .btn-ghost { background: white; color: var(--muted); border-color: #d6dae3; }
  .btn-ghost:hover { border-color: #6b8cae; color: var(--navy); }
  .btn-ghost:disabled { opacity: 0.45; cursor: not-allowed; }

  .welcome-actions { margin-top: 12px; }
  .welcome-actions > .btn-primary {
    display: block; width: 100%; border: 0; border-radius: 9px; padding: 13px 22px;
    font: inherit; font-weight: 650; line-height: normal;
  }
  .welcome-actions > .btn-primary:not(:disabled) { background: var(--welcome-action); }
  .welcome-actions > .btn-primary:hover:not(:disabled) { background: #164a79; }
  .welcome-actions .err { display: block; }
  .welcome-actions .err:not(:empty) { margin-top: 8px; }

  .banner {
    border-radius: 8px; padding: 11px 14px; margin-bottom: 14px; font-size: 15px;
  }
  .banner-warn { background: #fff3cd; border-left: 4px solid #ff9800; color: #7a5b00; }
  .banner-info { background: #e7f1fb; border-left: 4px solid #4da6ff; color: #1c4a75; }
  .banner-ok   { background: #d4edda; border-left: 4px solid #28a745; color: #155724; }

  /* --- progress --------------------------------------------------------- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: rgba(247,248,251,0.94); backdrop-filter: blur(6px);
    margin-bottom: 16px; padding: 6px 0 8px;
  }
  .topbar-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px 12px; flex-wrap: wrap; color: var(--muted); font-size: .9rem; font-weight: 500;
  }
  .progress-track {
    appearance: none; display: block; width: 100%; height: 6px; margin-top: 10px;
    border: 0; border-radius: 4px; background: #e3e9f1; overflow: hidden;
  }
  .progress-track::-webkit-progress-bar { background: transparent; }
  .progress-track::-webkit-progress-value { background: #245f95; }
  .progress-track::-moz-progress-bar { background: #245f95; }
  .sync { font-size: 15px; display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #9aa4b5; display: inline-block; }
  .dot.ok { background: #28a745; }
  .dot.pending { background: #ff9800; }
  .dot.off { background: #9aa4b5; }
  .dot.err { background: #d9534f; }

  /* --- Q&A -------------------------------------------------------------- */
  .rating-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: start; font-size: 1rem; }
  .rating-form { min-width: 0; }
  .qa-reference {
    min-width: 0; scroll-margin-top: 100px;
    padding: 14px 16px; border-radius: 8px; background: #edf4fc;
  }
  .source-check { display: flex; align-items: center; gap: 8px; width: fit-content; min-height: 44px; font-size: .91rem; cursor: pointer; }
  .source-check input { flex: none; width: 20px; height: 20px; margin: 0; }
  .source-not-assessed { color: var(--navy); font-weight: 600; margin: 10px 0 0; }
  [data-trust-controls][hidden], .source-not-assessed[hidden] { display: none; }
  @media (min-width: 1000px) {
    .wrap:has(.rating-layout) { max-width: 1320px; }
    .rating-layout { grid-template-columns: minmax(300px, 0.9fr) minmax(0, 1.1fr); gap: 24px; }
    .qa-reference { position: sticky; top: 60px; max-height: calc(100dvh - 84px); overflow-y: auto; }
  }
  .qa-item { white-space: pre-wrap; overflow-wrap: anywhere; }
  .qa-item + .qa-item { margin-top: 16px; }
  .box-label {
    display: block; font-size: 1rem; font-weight: 600; margin-bottom: 4px; color: var(--navy);
  }
  .box-text { font-size: 1.05rem; color: var(--ink); }
  .qa-answer-toggle { display: none; }

  /* --- metrics ---------------------------------------------------------- */
  .metric { padding: 16px 0; scroll-margin-top: 100px; }
  .rating-form > .metric:first-child { padding-top: 0; }
  .rating-form > .metric + .metric, .rating-actions { border-top: 1px solid var(--line); }
  .metric-name { display: block; font-weight: 600; color: var(--navy); font-size: 1.05rem; line-height: 1.4; }
  .tag {
    color: white; border-radius: 10px; padding: 1px 8px; font-size: 11px; font-weight: 600;
  }
  .tag.q { background: #856404; }
  .tag.a { background: #155724; }
  .tag.qa { background: #2c5aa0; }
  .metric-def { color: var(--text-2); font-size: .91rem; margin: 6px 0 12px 0; }

  .rating-options { display: grid; grid-template-columns: minmax(0, 1fr); gap: 7px; margin-top: 8px; }
  .rating-option {
    display: flex; align-items: center; gap: 10px; min-height: 44px;
    padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: white; color: var(--ink); font-size: 1rem; cursor: pointer;
  }
  .rating-option input { flex: none; width: 18px; height: 18px; margin: 0; accent-color: var(--navy-2); }
  .rating-option:hover, .rating-option:has(input:checked) { border-color: #6b8cae; }
  .rating-option:has(input:checked) { background: #edf4fc; }
  .rating-option:has(input:focus-visible) { outline: 2px solid #2c5aa0; outline-offset: 2px; }
  .other-box { margin-top: 8px; }
  .other-box[hidden] { display: none; }
  .other-box textarea { width: 100%; min-height: 56px; box-sizing: border-box; }
  .rating-form .field, .rating-form textarea { font-size: 1rem; }
  .source-materials .muted, .other-box .muted { font-size: .91rem; }
  .source-materials { margin-bottom: 12px; }
  .source-instruction {
    background: #edf4fc; color: var(--navy); border-left: 4px solid #2c5aa0;
    border-radius: 6px; padding: 12px 14px; margin-bottom: 12px;
    font-size: .91rem; line-height: 1.6;
  }
  .source-video summary, .source-transcript summary {
    cursor: pointer; color: var(--navy); font-weight: 700; margin-bottom: 10px;
    padding: 12px 14px; background: #f7f8fb; border: 1px solid #cfd6e2; border-radius: 8px;
  }
  .source-video summary:hover, .source-transcript summary:hover { background: #edf4fc; border-color: #6b8cae; }
  .source-video summary:focus-visible, .source-transcript summary:focus-visible { outline: 2px solid #2c5aa0; outline-offset: 2px; }
  .source-video .video-action-hide, .source-video[open] .video-action-show { display: none; }
  .source-video[open] .video-action-hide { display: inline; }
  .source-transcript { margin-top: 12px; }
  .source-transcript .transcript-action-hide, .source-transcript[open] .transcript-action-show { display: none; }
  .source-transcript[open] .transcript-action-hide { display: inline; }
  .transcript-text { max-height: 380px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin: 10px 0; line-height: 1.75; overflow-wrap: anywhere; }
  .transcript-text:focus-visible { outline: 2px solid #2c5aa0; outline-offset: 2px; }
  .video-frame {
    width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 8px;
    background: #111; display: block;
  }

  .navbtns { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 16px; }
  .navbtns .spacer { flex: 1; }
  .err { color: #b3261e; font-size: 15px; font-weight: 600; }
  .rating-form .err { font-size: .9rem; }

  .grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px 14px; margin: 8px 0 4px 0; }
  .chk { display: flex; align-items: center; gap: 7px; font-size: 13px; }
  .chk input { margin: 0; width: 15px; height: 15px; }

  /* video picker — one compact chip per video, grouped by dataset */
  .ds-group { margin-bottom: 12px; }
  .ds-group-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .ds-group-head b { font-size: 13px; color: var(--navy); }
  .vidgrid { display: flex; flex-wrap: wrap; gap: 6px; }
  .vidchk {
    display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
    border: 1px solid #d6dae3; border-radius: 6px; padding: 4px 9px;
    font-size: 12.5px; background: white; user-select: none;
  }
  .vidchk:hover { border-color: #6b8cae; }
  .vidchk input { margin: 0; width: 13px; height: 13px; }
  .vidchk.on { background: #eef4fb; border-color: #6b8cae; color: var(--navy); font-weight: 500; }
  .vidwrap { display: inline-flex; align-items: center; gap: 2px; }
  .vidlink {
    text-decoration: none; color: #9aa4b5; font-size: 11px; padding: 3px 4px;
    border-radius: 4px; line-height: 1;
  }
  .vidlink:hover { color: #c4302b; background: #f5f5f5; }
  .vidlink-inline {
    color: var(--navy); text-decoration: none; font-weight: 500; display: inline-block;
    border: 1px solid #d6dae3; border-radius: 6px; padding: 3px 10px; background: white;
  }
  .vidlink-inline:hover { border-color: #6b8cae; background: #eef4fb; }
  .qa-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .minibtn {
    font-size: 11px; padding: 3px 9px; border-radius: 6px;
    background: white; border: 1px solid #d6dae3; color: var(--muted); font-weight: 500;
  }
  .minibtn:hover { border-color: #6b8cae; color: var(--navy); }
  .selection-note {
    background: #eef4fb; border: 1px solid #cfe0f2; border-radius: 8px;
    padding: 9px 13px; margin-top: 12px; font-size: 13px; color: #1c4a75;
  }
  .inline-fields { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; }
  .inline-fields > div { min-width: 130px; }
  .inline-fields input { max-width: 130px; }

  table { border-collapse: collapse; width: 100%; font-size: 16px; margin-top: 8px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

  kbd {
    font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11px;
    background: #f0f2f7; border: 1px solid #d6dae3; border-bottom-width: 2px;
    border-radius: 4px; padding: 1px 5px; color: var(--muted);
  }
  .hidden { display: none !important; }
  @media (max-width: 620px) {
    .wrap { padding: 12px; }
    header { padding: 14px 16px; }
    .card { padding: 16px 14px; }
  }

  /* --- phones: side-by-side Q&A and one rating at a time ----------------- */
  .step-bar { display: none; }
  .rating-form button { font-size: revert; }
  .rating-actions .navbtns button { font-size: 1rem; }
  @media (max-width: 620px) {
    .rating-layout { grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 12px; }
    .qa-reference { padding: 12px 10px; }
    .qa-reference:has(.qa-answer-toggle[aria-expanded="false"]) #atext {
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden;
    }
    .qa-answer-toggle:not([hidden]) {
      display: block; max-width: 100%; padding: 0; border: 0; background: transparent;
      color: var(--welcome-action); font-weight: 600; text-align: left;
    }
    .rating-form.stepper { overflow-wrap: anywhere; }
    .rating-form.stepper .step-off { display: none; }
    .rating-form.stepper > .metric { padding-top: 0; }
    .rating-form.stepper > .metric + .metric, .rating-form.stepper .rating-actions { border-top: 0; }
    .rating-form.stepper .step-bar { display: block; border-top: 1px solid var(--line); padding-top: 12px; }
    .rating-form.stepper :is(#prev, #next, #rate-err, #step-err:empty, .navbtns .spacer) { display: none; }
    .rating-form.stepper .navbtns { display: block; margin-top: 8px; }
    .step-btns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .step-btns button, .rating-form.stepper #finish {
      padding: 7px 5px; font-size: 1rem; line-height: 1.25; font-weight: 600;
    }
    .step-btns button { min-height: 52px; }
    .rating-form.stepper #finish { width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">

<header class="study-header">
  <h1>Rate Dementia Care Q&As</h1>
  <div class="sub">A research study on dementia care advice</div>
</header>

<div id="app"><div class="card"><p class="muted">Loading Q&As…</p></div></div>

</div>

<script src="config.js"></script>
<script>
"use strict";

/* ===========================================================================
   Configuration + metric definitions
   =========================================================================== */

const CFG = Object.assign({
  SUPABASE_URL: "", SUPABASE_ANON_KEY: "",
  RATINGS_TABLE: "ratings_v6",
  STUDY_VERSION: "v6",
  // The Supabase function that decides which version a new annotator rates.
  CLAIM_FUNCTION: "claim_version_v6",
  // Approach names dropped from the corpus at load time. Excluded pairs never
  // reach DATA, so they cannot appear in the shared ordered set or in any
  // count. qa_data.json itself is left untouched.
  EXCLUDE_APPROACHES: [],
  // Allowlist. When non-empty it wins outright: ONLY these approaches enter the
  // corpus and every other one is dropped, including approaches that do not
  // exist yet. Prefer it to EXCLUDE_APPROACHES for a study with a fixed scope —
  // a new folder in the repo then cannot silently join the annotators' set.
  ONLY_APPROACHES: [],
}, window.EVAL_CONFIG || {});

// Normalised for comparison so a stray "dualagent" or " RAG " in config still
// matches the approach names recorded in qa_data.json.
const norm = (a) => String(a).trim().toLowerCase();
const EXCLUDED = new Set((CFG.EXCLUDE_APPROACHES || []).map(norm));
const ONLY = new Set((CFG.ONLY_APPROACHES || []).map(norm));
const isExcluded = (approach) =>
  ONLY.size ? !ONLY.has(norm(approach)) : EXCLUDED.has(norm(approach));

// Tolerate the two easy paste mistakes: a trailing slash, and copying the REST
// endpoint (".../rest/v1") instead of the bare project URL. Both would
// otherwise produce a 404 on every insert with no obvious cause.
const SUPABASE_ORIGIN = String(CFG.SUPABASE_URL || "")
  .trim()
  .replace(/\/+$/, "")
  .replace(/\/rest\/v1$/, "");
const RATINGS_TABLE = String(CFG.RATINGS_TABLE || "ratings_v6").trim();
const CLAIM_FUNCTION = String(CFG.CLAIM_FUNCTION || "claim_version_v6").trim();

// The evaluator sees and saves the same response text. Keep the metric and
// export keys stable so the new rubric fits the rest of the rating workflow.
const METRICS = [
  {
    key: "qa_alignment", dbPrefix: "qna_trustworthiness", label: "Q&A Trustworthiness",
    question: "Does the Q&A match the video?",
    def: "Does the answer reflect what is said in the video?",
    attribute: ["Fully matches", "Partially matches", "Does not match", "Cannot determine"],
  },
  {
    key: "qa_accessibility", dbPrefix: "qna_clarity", label: "Q&A Clarity",
    question: "Is the Q&A clear and easy to understand?",
    def: "Consider the wording, length, and use of unfamiliar terms.",
    attribute: ["Very clear", "Mostly clear", "Unclear"],
  },
  {
    key: "qa_edu_actionable", dbPrefix: "qna_usefulness", label: "Q&A Usefulness",
    question: "Is the Q&A useful for dementia caregivers?",
    def: "Does it provide relevant information or practical guidance?",
    attribute: ["Very useful", "Somewhat useful", "Not useful"],
  },
  {
    key: "qa_mental_health", dbPrefix: "qna_care_safety", label: "Q&A Care Safety",
    question: "Does the Q&A contain potentially unsafe or disrespectful advice?",
    def: "Consider the well-being and dignity of the person with dementia.",
    choices: ["Yes", "No", "Not sure"],
    concernChoices: ["Yes", "Not sure"],
  },
  {
    key: "qa_standalone", dbPrefix: "qna_standalone", label: "Q&A Standalone",
    question: "Does the Q&A provide enough context to be understood on its own?",
    choices: ["Yes", "No"],
  },
];

// The standalone question comes before the source video; keep the data and
// export order above independent of the order the reviewer sees.
const METRICS_BEFORE_VIDEO = ["qa_standalone"];

function displayMetrics() {
  const selected = METRICS.filter((m) => S.metrics.includes(m.key));
  return selected.filter((m) => METRICS_BEFORE_VIDEO.includes(m.key))
    .concat(selected.filter((m) => !METRICS_BEFORE_VIDEO.includes(m.key)));
}

const RECOMMENDATION = ["Yes", "With reservations", "No"];
const qNum = (key) => {
  const order = [...METRICS.filter((m) => METRICS_BEFORE_VIDEO.includes(m.key)), ...METRICS.filter((m) => !METRICS_BEFORE_VIDEO.includes(m.key))];
  return "question " + (order.findIndex((m) => m.key === key) + 1);
};

// An annotator can select any of the four groups. Healthcare professionals and
// students are routed to the medical group. Other has an optional description.
const ANNOTATOR_GROUPS = [
  { value: "healthcare", label: "Healthcare professional" },
  { value: "student", label: "Medical student" },
  { value: "family", label: "Family/friend dementia caregiver" },
  { value: "other", label: "Others" },
];
const ROLE_DETAIL_MAX = 200;
// Sessions saved before these four roles used five older codes.
const LEGACY_GROUP = { clinical: "healthcare", care: "healthcare", student: "student", family: "family", other: "other" };
const DEMENTIA_EXPERIENCE = [
  { value: "none", label: "None" },
  { value: "less_one_year", label: "Less than 1 year" },
  { value: "one_to_three_years", label: "1–3 years" },
  { value: "more_three_years", label: "More than 3 years" },
];

function normalizeAnnotatorProfile(profile) {
  const source = profile || {};
  // Sessions saved before multiple roles carry a single "group" (and an "other" text).
  const picked = (Array.isArray(source.groups) ? source.groups : (source.group ? [source.group] : []))
    .map((g) => (ANNOTATOR_GROUPS.some((x) => x.value === g) ? g : LEGACY_GROUP[g]));
  // Keep the listed order and drop anything unknown, so the stored value is stable.
  const groups = ANNOTATOR_GROUPS.map((g) => g.value).filter((v) => picked.includes(v));
  const given = Object.assign({}, source.other && !source.details ? { other: source.other } : {}, source.details || {});
  // Optional descriptions: kept only for ticked roles, trimmed, empty ones dropped.
  const details = {};
  for (const g of groups) {
    const text = String(given[g] || "").trim();
    if (text) details[g] = text;
  }
  const experience = DEMENTIA_EXPERIENCE.some((e) => e.value === source.experience) ? source.experience : null;
  return { groups, details, experience };
}

function roleDetailsText(details) {
  return ANNOTATOR_GROUPS.filter((g) => details && details[g.value])
    .map((g) => g.label + ": " + details[g.value]).join(" | ");
}

function profileColumns(profile) {
  const p = normalizeAnnotatorProfile(profile);
  // Old queued rows can still be sent without a profile. New sessions require
  // both answers on the welcome screen before rating begins.
  if (!p.groups.length || !p.experience) {
    return { annotator_groups: null, annotator_role_details: null, dementia_care_experience: null };
  }
  return {
    annotator_groups: p.groups,
    annotator_role_details: p.details,
    dementia_care_experience: p.experience,
  };
}

/* ===========================================================================
   Deterministic helpers.
   =========================================================================== */

// FNV-1a, used for stable local session ids.
function hashStr(s) {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h >>> 0;
}

// mulberry32: a small seeded generator, so one assignment always gets the same
// order on every reload and in every browser.
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Fisher-Yates over a copy, seeded by the assignment id.
function seededShuffle(items, seedText) {
  const out = items.slice();
  const rand = mulberry32(hashStr(String(seedText)));
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

const slug = (s) => (s || "anonymous").trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "anonymous";
const qaIndex = (p) => {
  const match = String(p.uid || "").match(/_q(\d+)$/);
  return match ? Number(match[1]) : Number.MAX_SAFE_INTEGER;
};
// Plain codepoint comparison, NOT localeCompare: collation is locale-dependent,
// so the same two strings can order differently in two browsers. Every
// annotator must be handed the same ordered set, so the comparator has to be
// identical everywhere.
const cmp = (x, y) => (x < y ? -1 : x > y ? 1 : 0);
const pairSort = (a, b) =>
  qaIndex(a) - qaIndex(b)
  || a.video - b.video
  || cmp(a.dataset, b.dataset)
  || cmp(a.approach, b.approach)
  || cmp(a.uid, b.uid);

/* ===========================================================================
   State
   =========================================================================== */

let DATA = [];            // the selected Q&As from qa_data.json (25 in Phase 0)
let VERSIONS = {};        // { "1": [5 uids], ... } from versions.json, five groups per batch
let PROVISIONAL = false;  // versions.json is a placeholder selection
let VIDEOS = {};          // { dataset: { video: { url, language } } } from the dataset CSVs
let TRANSCRIPTS = {};     // { dataset: { video: [{ start, end, text }] } }
let S = null;             // the live session (see makeSession)
let shownAt = 0;          // timestamp the current pair appeared
let syncState = "off";    // off | ok | pending | err

const app = document.getElementById("app");
const params = new URLSearchParams(location.search);
const backendOn = Boolean(SUPABASE_ORIGIN && CFG.SUPABASE_ANON_KEY);

/* ===========================================================================
   Session construction
   =========================================================================== */

// Study settings come only from the deployed configuration, never from saved
// annotator preferences.
function fixedStudyOptions() {
  return {
    mode: "assigned-version",
    metrics: METRICS.map((m) => m.key),
    blind: true,
  };
}

// This browser's assignments, so a returning annotator resumes their own
// version instead of claiming a new one. Another device has no record of it and
// claims a fresh assignment; the database keeps both, each under its own id.
// Earlier preview sessions used different response scales. Preserve their
// browser records and start a new assignment for this rubric.
const RATING_STORAGE_PREFIX = "dqa:" + slug(CFG.STUDY_VERSION || "v6") + ":rubric";
const ASSIGNMENTS_KEY = RATING_STORAGE_PREFIX + ":assignments";
function knownAssignments() {
  try {
    const list = JSON.parse(localStorage.getItem(ASSIGNMENTS_KEY) || "[]");
    return Array.isArray(list) ? list : [];
  } catch (e) {
    return [];
  }
}
function rememberAssignment(session) {
  const list = knownAssignments().filter((a) => a.id !== session.assignmentId);
  list.push({ id: session.assignmentId, name: slug(session.annotator), version: session.evalVersion });
  try { localStorage.setItem(ASSIGNMENTS_KEY, JSON.stringify(list)); }
  catch (e) { console.warn("localStorage write failed", e); }
}
// The most recent assignment this browser holds for a name, or null.
function assignmentFor(name) {
  const matches = knownAssignments().filter((a) => a.name === slug(name));
  return matches.length ? matches[matches.length - 1] : null;
}
const storeKeyFor = (assignmentId) =>
  RATING_STORAGE_PREFIX + ":a:" + String(assignmentId);

// One version's Q&As, in this assignment's own seeded order.
function versionUids(version, assignmentId) {
  return seededShuffle(VERSIONS[String(version)] || [], assignmentId);
}

function makeSession(name, claim) {
  const opts = fixedStudyOptions();
  return {
    version: 8,
    annotator: name,
    annotatorProfile: null,
    assignmentId: claim.assignment_id,
    evalVersion: Number(claim.eval_version),
    expiresAt: claim.expires_at || null,
    storeKey: storeKeyFor(claim.assignment_id),
    sessionId: String(claim.assignment_id),
    opts: opts,
    metrics: opts.metrics,
    uids: versionUids(claim.eval_version, claim.assignment_id),
    index: 0,
    scores: {},        // uid -> { metricKey: { optional attribute, errors, binary } }
    recommendations: {}, // uid -> caregiver recommendation label
    recommendationNotes: {}, // uid -> optional explanation for a No answer
    comments: {},      // uid -> general note from earlier previews
    seconds: {},       // uid -> seconds spent
    queue: [],         // rows waiting to reach Supabase
    startedAt: new Date().toISOString(),
  };
}

function save() {
  if (!S) return;
  try {
    localStorage.setItem(S.storeKey, JSON.stringify(S));
  } catch (e) {
    console.warn("localStorage write failed", e);
  }
}

function restore(storeKey) {
  try {
    const raw = localStorage.getItem(storeKey);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (!obj || obj.version !== 8) return null;
    obj.scores = obj.scores || {};
    obj.recommendations = obj.recommendations || {};
    obj.recommendationNotes = obj.recommendationNotes || {};
    obj.comments = obj.comments || {};
    obj.seconds = obj.seconds || {};
    obj.queue = obj.queue || [];
    // Do not silently trim an older assignment or alter its saved ratings.
    // The welcome screen checks compatibility before allowing a resume.
    return obj;
  } catch (e) {
    return null;
  }
}

// A saved session must still hold exactly its version's selected Q&As. If the
// deployed versions ever changed, stop rather than mix two selections.
function matchesAssignment(saved) {
  const expected = VERSIONS[String(saved.evalVersion)] || [];
  return Array.isArray(saved.uids) && Array.isArray(saved.metrics) &&
    JSON.stringify(saved.uids.slice().sort()) === JSON.stringify(expected.slice().sort()) &&
    JSON.stringify(saved.metrics) === JSON.stringify(fixedStudyOptions().metrics);
}

/* ===========================================================================
   Version claim — the database decides which version a new annotator rates.
   =========================================================================== */

async function claimVersion(name, profile) {
  if (!backendOn) {
    // Local-only testing: no quotas without the database. ?version=N picks a
    // version, otherwise version 1.
    const v = Math.min(Object.keys(VERSIONS).length, Math.max(1, Number(params.get("version")) || 1));
    return { assignment_id: "local-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8),
             eval_version: v, expires_at: null };
  }
  const resp = await fetch(SUPABASE_ORIGIN + "/rest/v1/rpc/" + encodeURIComponent(CLAIM_FUNCTION), {
    method: "POST",
    headers: {
      "apikey": CFG.SUPABASE_ANON_KEY,
      "Authorization": "Bearer " + CFG.SUPABASE_ANON_KEY,
      "Content-Type": "application/json",
    },
    body: JSON.stringify({
      p_name: name,
      p_groups: profile.groups,
      p_role_details: profile.details,
      p_experience: profile.experience,
    }),
  });
  if (!resp.ok) throw new Error("HTTP " + resp.status + " " + (await resp.text()).slice(0, 200));
  const rows = await resp.json();
  const claim = Array.isArray(rows) ? rows[0] : rows;
  if (!claim || !claim.assignment_id || !VERSIONS[String(claim.eval_version)]) {
    throw new Error("unexpected claim response");
  }
  return claim;
}

const pairOf = (uid) => DATA.find((p) => p.uid === uid);

/**
 * Link to the source video on YouTube, or null if the dataset CSV had no URL.
 */
function videoLink(p, withTimestamp) {
  const v = (VIDEOS[p.dataset] || {})[String(p.video)];
  if (!v || !v.url) return null;
  if (!withTimestamp || typeof p.t !== "number") return v.url;
  const url = new URL(v.url);
  url.searchParams.set("t", Math.max(0, Math.round(p.t)) + "s");
  return url.toString();
}

function videoLinkFor(dataset, video) {
  const v = (VIDEOS[dataset] || {})[String(video)];
  return v && v.url ? v.url : null;
}

function youtubeId(url) {
  try {
    const u = new URL(url);
    const host = u.hostname.replace(/^www\./, "");
    if (host === "youtu.be") return u.pathname.split("/").filter(Boolean)[0] || null;
    if (host.endsWith("youtube.com")) {
      if (u.searchParams.get("v")) return u.searchParams.get("v");
      const parts = u.pathname.split("/").filter(Boolean);
      if (["embed", "shorts", "live"].includes(parts[0])) return parts[1] || null;
    }
  } catch (e) {
    return null;
  }
  return null;
}

function videoTimeLabel(seconds) {
  const total = Math.max(0, Math.round(seconds));
  const hours = Math.floor(total / 3600);
  const minutes = Math.floor((total % 3600) / 60);
  const secs = String(total % 60).padStart(2, "0");
  return hours ? `${hours}:${String(minutes).padStart(2, "0")}:${secs}` : `${minutes}:${secs}`;
}

function sourceVideo(p) {
  const v = (VIDEOS[p.dataset] || {})[String(p.video)];
  if (!v || !v.url) return null;
  const id = youtubeId(v.url);
  if (!id) return { url: v.url, embed: null, hasClip: false };
  const hasClip = Number.isFinite(p.t);
  // "aligned" clips were recovered by matching the Q&A back to the transcript
  // (eval/align_timestamps.py) because the generator wrote no usable range —
  // they are approximate, and the caption below the player says so.
  const widened = hasClip && p.ts === "widened";
  const approx = hasClip && (p.ts === "aligned" || p.ts === "aligned-low" || widened);
  // A weak alignment gets a start but no end: seeking near the likely segment
  // helps, while cutting the clip off at a guessed boundary would hide the real
  // source from someone who has to judge whether the Q&A matches the video.
  const weak = p.ts === "aligned-low";
  const start = hasClip ? Math.max(0, Math.round(p.t)) : 0;
  const end = hasClip && !weak && Number.isFinite(p.te) && Math.round(p.te) > start ? Math.round(p.te) : null;
  const params = new URLSearchParams({ rel: "0", controls: "1", playsinline: "1", enablejsapi: "1", start: String(start) });
  if (/^https?:$/.test(location.protocol)) params.set("origin", location.origin);
  if (end) params.set("end", String(end));
  return {
    url: videoLink(p, true),
    embed: `https://www.youtube.com/embed/${id}?${params.toString()}`,
    hasClip,
    approx,
    widened,
    weak,
    playback: { videoId: id, startSeconds: start, ...(end === null ? {} : { endSeconds: end }) },
    timeLabel: hasClip ? (end === null ? `${videoTimeLabel(start)} onward` : `${videoTimeLabel(start)}–${videoTimeLabel(end)}`) : null,
  };
}

let youtubeAPIReady = null;
let sourcePlayer = null;

function loadYouTubeAPI() {
  if (window.YT && typeof window.YT.Player === "function") return Promise.resolve(window.YT);
  if (!youtubeAPIReady) {
    youtubeAPIReady = new Promise((resolve, reject) => {
      window.onYouTubeIframeAPIReady = () => resolve(window.YT);
      const script = document.createElement("script");
      script.src = "https://www.youtube.com/iframe_api";
      script.async = true;
      script.onerror = () => {
        youtubeAPIReady = null;
        script.remove();
        reject(new Error("YouTube player API unavailable"));
      };
      document.head.appendChild(script);
    });
  }
  return youtubeAPIReady;
}

function releaseSourcePlayer() {
  const previous = sourcePlayer;
  sourcePlayer = null;
  if (previous && previous.player) {
    try { previous.player.destroy(); } catch (e) { /* The iframe may already be gone. */ }
  }
}

function bindSourcePlayback(source) {
  const frame = document.getElementById("source-video-player");
  const panel = document.getElementById("source-video-panel");
  if (!source || !source.hasClip || !frame || !panel) return;
  const binding = { player: null, replayPending: false };
  sourcePlayer = binding;
  const current = () => sourcePlayer === binding && frame.isConnected;
  const mount = () => loadYouTubeAPI().then((YT) => {
    if (!current() || binding.player) return;
    binding.player = new YT.Player(frame, { events: {
      onStateChange: (event) => {
        if (!current()) return;
        // Re-cue the full clip specification, including its end. seekTo() would
        // discard endSeconds, and YouTube's default Replay may start at zero.
        if (event.data === 0 && !binding.replayPending) {
          binding.replayPending = true;
          event.target.cueVideoById(source.playback);
        } else if (event.data === 1 && binding.replayPending) {
          binding.replayPending = false;
          if (event.target.getCurrentTime() < source.playback.startSeconds - 1) {
            event.target.loadVideoById(source.playback);
          }
        }
      },
    } });
  }).catch(() => { /* Keep the standard player usable if the API is unavailable. */ });
  panel.addEventListener("toggle", () => { if (panel.open) mount(); });
  if (panel.open) mount();
}

function escapeAttr(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function sourceTranscript(p) {
  const segments = (TRANSCRIPTS[p.dataset] || {})[String(p.video)];
  const available = Array.isArray(segments) ? segments.filter((s) =>
    typeof s.text === "string" && s.text.trim() && Number.isFinite(s.start) &&
    Number.isFinite(s.end) && s.start >= 0 && s.end > s.start) : [];
  const hasRange = Number.isFinite(p.t) && Number.isFinite(p.te) && p.te > p.t && p.ts !== "aligned-low";
  const inRange = (s) => hasRange && s.end > p.t && s.start < p.te;
  const excerpt = available.filter(inRange);
  const text = excerpt.map((s) => s.text.trim()).join(" ");
  return `<details class="source-transcript">
    <summary><span class="transcript-action-show">Read the clip transcript</span><span class="transcript-action-hide">Hide the clip transcript</span></summary>
    ${!hasRange ? '<p class="muted">No transcript for this clip, because we do not know where the clip starts and ends.</p>' : available.length ? `<p><strong>Transcript for this clip (${videoTimeLabel(p.t)}–${videoTimeLabel(p.te)})</strong></p>
      ${excerpt.length ? `<div class="transcript-text" tabindex="0" role="region" aria-label="Transcript for this clip">${escapeAttr(text)}</div>` : '<p class="muted">No transcript text is available in this time range.</p>'}`
      : '<p class="muted">The transcript is not available right now. You can still watch the video above.</p>'}
  </details>`;
}

function hasAttributeScale(metric) {
  return Boolean(metric && metric.attribute);
}

function answerField(metric) {
  return hasAttributeScale(metric) ? "attribute" : "binary";
}

function answerChoices(metric) {
  return metric.attribute || metric.choices;
}

function completeRecommendation(value) {
  return RECOMMENDATION.includes(value);
}

function metricState(uid, key) {
  const row = S.scores[uid] || (S.scores[uid] = {});
  if (!row[key] || typeof row[key] !== "object") row[key] = {};
  return row[key];
}

function isSourceUnverifiable(value, metric) {
  return Boolean(metric && metric.key === "qa_alignment" && value && value.sourceUnverifiable === true);
}

function completeMetric(value, metric) {
  return Boolean(value && metric && (isSourceUnverifiable(value, metric) ||
    answerChoices(metric).includes(value[answerField(metric)])));
}

function dbPrefix(metric) {
  return metric && metric.dbPrefix ? metric.dbPrefix : metric.key;
}

function showsConcern(metric, answer) {
  return Boolean(metric.concernChoices?.includes(answer));
}

function concernText(value, metric) {
  return showsConcern(metric, value?.binary) ? (value.concern || "").trim() : "";
}

function recommendationNote(uid) {
  return S.recommendations[uid] === "No" ? (S.recommendationNotes[uid] || "").trim() : "";
}

function evaluatorComment(uid) {
  return recommendationNote(uid) || (S.comments[uid] || "").trim();
}

const isRated = (uid) => {
  const sc = S.scores[uid];
  return Boolean(sc) &&
    S.metrics.every((k) => {
      const metric = METRICS.find((m) => m.key === k);
      return completeMetric(sc[k], metric);
    }) &&
    completeRecommendation(S.recommendations && S.recommendations[uid]);
};
const ratedCount = () => S.uids.filter(isRated).length;

/* ===========================================================================
   Supabase sync — fire and forget, with a persisted retry queue.
   The page never reads from the database; resume comes from localStorage.
   =========================================================================== */

function enqueue(uid) {
  const p = pairOf(uid);
  const sc = S.scores[uid] || {};
  const row = {
    study_version: CFG.STUDY_VERSION || "v6",
    assignment_id: S.assignmentId,
    eval_version: S.evalVersion,
    session_id: S.sessionId,
    annotator: S.annotator,
    ...profileColumns(S.annotatorProfile),
    qa_uid: uid,
    dataset: p.dataset,
    video: p.video,
    approach: p.approach,
    question_text: p.question,
    answer_text: p.answer,
    source_start_sec: typeof p.t === "number" ? p.t : null,
    source_end_sec: typeof p.te === "number" ? p.te : null,
    batch: "version-" + S.evalVersion,
    blind: S.opts.blind,
    seconds_spent: S.seconds[uid] || null,
    client_time: new Date().toISOString(),
    source_unverifiable: Boolean(sc.qa_alignment && sc.qa_alignment.sourceUnverifiable),
  };
  for (const m of METRICS) {
    const ms = sc[m.key] || {};
    const prefix = dbPrefix(m);
    const assessed = completeMetric(ms, m) && !isSourceUnverifiable(ms, m);
    if (hasAttributeScale(m)) row[prefix + "_attribute"] = assessed ? ms.attribute : null;
    row[prefix + "_issue"] = assessed ? concernText(ms, m) : null;
    row[prefix + "_binary"] = assessed ? ms.binary : null;
  }
  row.caregiver_recommendation = completeRecommendation(S.recommendations[uid])
    ? S.recommendations[uid]
    : null;
  const comment = evaluatorComment(uid);
  if (comment) row.evaluator_comment = comment;

  // One row per pair in the queue; a re-rated pair replaces its pending row.
  S.queue = S.queue.filter((r) => r.qa_uid !== uid);
  S.queue.push(row);
  save();
  flush();
}

function normalizeSupabaseRow(row) {
  const p = pairOf(row.qa_uid) || {};
  const out = {
    study_version: row.study_version || CFG.STUDY_VERSION || "v6",
    assignment_id: row.assignment_id,
    eval_version: row.eval_version,
    session_id: row.session_id,
    annotator: row.annotator,
    annotator_groups: row.annotator_groups ?? null,
    annotator_role_details: row.annotator_role_details ?? null,
    dementia_care_experience: row.dementia_care_experience ?? null,
    qa_uid: row.qa_uid,
    dataset: row.dataset,
    video: row.video,
    approach: row.approach,
    question_text: row.question_text || p.question || "",
    answer_text: row.answer_text || p.answer || "",
    source_start_sec: row.source_start_sec ?? (typeof p.t === "number" ? p.t : null),
    source_end_sec: row.source_end_sec ?? (typeof p.te === "number" ? p.te : null),
    batch: row.batch || null,
    blind: row.blind !== undefined ? row.blind : true,
    caregiver_recommendation: row.caregiver_recommendation || null,
    evaluator_comment: row.evaluator_comment || null,
    seconds_spent: row.seconds_spent || null,
    client_time: row.client_time || new Date().toISOString(),
    source_unverifiable: row.source_unverifiable ?? null,
  };

  for (const metric of METRICS) {
    const prefix = dbPrefix(metric);
    if (hasAttributeScale(metric)) {
      out[prefix + "_attribute"] = row[prefix + "_attribute"] ?? row[metric.key + "_attribute"] ?? null;
    }
    out[prefix + "_issue"] = row[prefix + "_issue"] ?? row[metric.key + "_error"] ?? null;
    out[prefix + "_binary"] = row[prefix + "_binary"] ?? row[metric.key + "_binary"] ?? null;
  }

  if (out.source_unverifiable === true) {
    out.qna_trustworthiness_attribute = null;
    out.qna_trustworthiness_issue = null;
    out.qna_trustworthiness_binary = null;
  }

  return out;
}

let flushing = false;
async function flush() {
  if (!backendOn || flushing || !S || S.queue.length === 0) {
    setSync(backendOn ? (S && S.queue.length ? "pending" : "ok") : "off");
    return;
  }
  flushing = true;
  setSync("pending");
  const sending = new Set(S.queue.slice(0, 25));
  const batch = Array.from(sending, normalizeSupabaseRow);
  try {
    const resp = await fetch(SUPABASE_ORIGIN + "/rest/v1/" + encodeURIComponent(RATINGS_TABLE), {
      method: "POST",
      headers: {
        "apikey": CFG.SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + CFG.SUPABASE_ANON_KEY,
        "Content-Type": "application/json",
        // return=minimal matters: asking for the inserted rows back would need
        // SELECT permission, which the insert-only policy deliberately denies.
        "Prefer": "return=minimal",
      },
      body: JSON.stringify(batch),
    });
    if (!resp.ok) throw new Error("HTTP " + resp.status + " " + (await resp.text()).slice(0, 200));
    // An edit may have replaced a queued row while the request was in flight.
    S.queue = S.queue.filter((row) => !sending.has(row));
    save();
    setSync(S.queue.length ? "pending" : "ok");
    flushing = false;
    if (S.queue.length) flush();
  } catch (e) {
    console.warn("sync failed, will retry", e);
    setSync("err");
    flushing = false;
  }
}

function setSync(state) {
  syncState = state;
  const el = document.getElementById("sync");
  if (!el) return;
  const map = {
    ok:      ["ok",      "Saved ✓"],
    pending: ["pending", "Saving…"],
    err:     ["err",     "Not saved yet — check your internet. We will keep trying."],
    off:     ["off",     "Saved on this device ✓"],
  };
  const [cls, text] = map[state] || map.off;
  el.innerHTML = '<span class="dot ' + cls + '" aria-hidden="true"></span>' + text;
}

// Retry whenever the network comes back or the tab is refocused.
window.addEventListener("online", flush);
document.addEventListener("visibilitychange", () => { if (!document.hidden) flush(); });
window.addEventListener("beforeunload", (e) => {
  if (S && S.queue.length && backendOn) { e.preventDefault(); e.returnValue = ""; }
});

// Human-readable export columns; binary-only metrics intentionally omit Attribute.
function metricCsvCols() {
  return METRICS.flatMap((m) => [
    ...(hasAttributeScale(m) ? [m.label + " Attribute"] : []),
    m.label + " Error Type",
    m.label + " Yes/No",
  ]);
}

const CSV_COLS = ["Dataset", "Video Index", "Approach", "QA ID", "Question", "Answer"]
  .concat(metricCsvCols())
  .concat(["Caregiver Recommendation", "Evaluator Comment", "Annotator", "Session ID", "Version", "Seconds",
    "Source Unverifiable",
    "Annotator Roles", "Role Details", "Dementia-care Experience"]);

function csvCell(v) {
  const s = v === null || v === undefined ? "" : String(v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function buildCsv() {
  const lines = [CSV_COLS.join(",")];
  for (const uid of S.uids) {
    const p = pairOf(uid);
    const sc = S.scores[uid] || {};
    const row = [p.dataset, p.video, p.approach, uid, p.question, p.answer];
    for (const m of METRICS) {
      const ms = sc[m.key] || {};
      const unavailable = isSourceUnverifiable(ms, m);
      if (hasAttributeScale(m)) row.push(unavailable ? "" : ms.attribute || "");
      row.push(concernText(ms, m), unavailable ? "" : ms.binary || "");
    }
    const recommendation = S.recommendations[uid];
    row.push(completeRecommendation(recommendation) ? recommendation : "",
      evaluatorComment(uid),
      S.annotator, S.sessionId,
      S.evalVersion,
      S.seconds[uid] || "",
      sc.qa_alignment ? (sc.qa_alignment.sourceUnverifiable ? "Yes" : "No") : "",
      ...(() => {
        const c = profileColumns(S.annotatorProfile);
        return [c.annotator_groups ? c.annotator_groups.join("; ") : "",
          c.annotator_role_details ? roleDetailsText(c.annotator_role_details) : "",
          c.dementia_care_experience || ""];
      })());
    lines.push(row.map(csvCell).join(","));
  }
  return lines.join("\r\n");
}

function download(filename, text, mime) {
  const blob = new Blob(["﻿" + text], { type: (mime || "text/plain") + ";charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function stamp() {
  const d = new Date(), p = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "_" + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
}

const exportCsv = () => download("qa_eval_" + slug(S.annotator) + "_" + stamp() + ".csv", buildCsv(), "text/csv");

// Retain the storage key so returning annotators keep their name. Old saved
// selection preferences are ignored; the assignment is fixed by the study.
// This study stores names and sessions separately under dqa:v6:.
const LAST_OPTS_KEY = "dqa:" + slug(CFG.STUDY_VERSION || "v6") + ":lastopts";
function loadLastOpts() {
  try { return JSON.parse(localStorage.getItem(LAST_OPTS_KEY) || "null"); }
  catch (e) { return null; }
}
function saveLastOpts(opts, name) {
  try { localStorage.setItem(LAST_OPTS_KEY, JSON.stringify({ ...opts, name: name })); }
  catch (e) { /* private browsing — not worth interrupting the annotator */ }
}

function renderWelcome() {
  releaseSourcePlayer();

          <legend class="field">Your role</legend>
          <p class="muted" id="role-hint">Select all that apply.</p>
          ${ANNOTATOR_GROUPS.map((g) => `

  const nameEl = document.getElementById("name");
  const roleEls = ANNOTATOR_GROUPS.map((g) => document.getElementById("role-" + g.value));
  const checkedGroups = () => ANNOTATOR_GROUPS.filter((g, i) => roleEls[i].checked).map((g) => g.value);
  const otherRoleEl = document.getElementById("role-other");
  const otherDetailEl = document.getElementById("role-detail-other");
  const otherDetailField = document.getElementById("role-detail-field-other");
  const experienceEl = document.getElementById("dementia-experience");
  const err = document.getElementById("start-err");
  let profileStoreKey = null;
  let profileRestored = false;
  const updateOtherDetail = () => {
    otherDetailField.hidden = !otherRoleEl.checked;
  };
  const fillProfile = (profile) => {
    const p = normalizeAnnotatorProfile(profile);
    roleEls.forEach((el, i) => { el.checked = p.groups.includes(ANNOTATOR_GROUPS[i].value); });
    otherDetailEl.value = p.details.other || "";
    experienceEl.value = p.experience || "";
    updateOtherDetail();
  };
  roleEls.forEach((el) => el.addEventListener("change", () => { updateOtherDetail(); err.textContent = ""; }));
  experienceEl.addEventListener("change", () => { err.textContent = ""; });
  otherDetailEl.addEventListener("input", () => { err.textContent = ""; });

  // Tell a returning annotator that their progress is still here.
  const savedFor = (name) => {
    const known = name ? assignmentFor(name) : null;
    return known ? restore(storeKeyFor(known.id)) : null;
  };
  const checkResume = () => {
    const note = document.getElementById("resume-note");
    if (!nameEl.value.trim()) { note.textContent = ""; return; }
    const prev = savedFor(nameEl.value.trim());
    const key = prev ? prev.storeKey : null;
    if (profileStoreKey !== key) {
      // Restore the profile only when the name identifies a saved session.
      // Keep a new annotator's choices while they finish typing their name.
      if (prev) fillProfile(prev.annotatorProfile);
      else if (profileRestored) fillProfile(null);
      profileStoreKey = key;
      profileRestored = Boolean(prev);
    }
    if (prev && !matchesAssignment(prev)) {
      note.textContent = "Your saved work does not match this study. It is still saved. Please contact the research team before you go on.";
    } else if (prev) {
      const done = prev.uids.filter((u) => {
        const sc = prev.scores[u];
        return sc && prev.metrics.every((k) => {
          const metric = METRICS.find((m) => m.key === k);
          return completeMetric(sc[k], metric);
        }) &&
          completeRecommendation(prev.recommendations && prev.recommendations[u]);
      }).length;
      note.innerHTML = `<span style="color:#155724;">Welcome back! You have rated ${done} of ${prev.uids.length} Q&As. You will pick up where you left off.</span>`;
    } else {
      note.innerHTML = `<span class="muted">New session: ${pairCount} Q&As.</span>`;
    }
  };
  nameEl.addEventListener("input", () => { err.textContent = ""; checkResume(); });
  checkResume();

  const startBtn = document.getElementById("start");
  startBtn.addEventListener("click", () => {
    const name = nameEl.value.trim();
    if (!name) { err.textContent = "Please enter your name first."; nameEl.focus(); return; }
    const profile = normalizeAnnotatorProfile({
      groups: checkedGroups(), details: { other: otherDetailEl.value }, experience: experienceEl.value,
    });
    if (!profile.groups.length) { err.textContent = "Please select at least one role."; roleEls[0].focus(); return; }
    if ((profile.details.other || "").length > ROLE_DETAIL_MAX) {
      err.textContent = `Use ${ROLE_DETAIL_MAX} characters or fewer for your role description.`;
      otherDetailEl.focus();
      return;
    }
    if (!profile.experience) { err.textContent = "Please choose your dementia-care experience."; experienceEl.focus(); return; }
    const prev = savedFor(name);
    if (prev && !matchesAssignment(prev)) {
      err.textContent = "Your saved work does not match this study. Please contact the research team. Your saved work has not been changed.";
      return;
    }
    saveLastOpts(fixedStudyOptions(), name);
    if (prev) {
      // A returning annotator keeps their version, order and the profile they
      // were routed with: the database files every rating under that profile.
      S = prev;
      S.opts = fixedStudyOptions(); // Always keep model names hidden, including on resume.
      if (!S.annotatorProfile) S.annotatorProfile = profile;
      return startRating();
    }
    if (startBtn.disabled) return;
    startBtn.disabled = true;
    err.textContent = "";
    claimVersion(name, profile).then((claim) => {
      S = makeSession(name, claim);
      S.annotatorProfile = profile;
      rememberAssignment(S);
      startRating();
    }).catch((e) => {
      console.warn("version claim failed", e);
      startBtn.disabled = false;
      err.textContent = "Could not reach the study server. Check your internet and press Continue again.";
    });
  });

  const startRating = () => {
    // Resume at the first pair that still has an unrated metric.
    const next = S.uids.findIndex((u) => !isRated(u));
    S.index = next === -1 ? S.uids.length : next;
    save();
    flush();
    renderRate();
  };

  nameEl.addEventListener("keydown", (e) => { if (e.key === "Enter") document.getElementById("start").click(); });
}

function ratingOptions(key, choices, selected) {
  return `<div class="rating-options" role="radiogroup" aria-labelledby="qname-${key}">

      <label class="rating-option">

}

function sourceMaterials(source, pair, scores) {
  const openVideo = METRICS_BEFORE_VIDEO.some((key) => scores[key]?.binary);
  const clipNote = !source ? "" : !source.hasClip ? "We do not know which part of the video this Q&A comes from, so the whole video is shown."
    : source.weak ? "We are not sure where this part starts. The video starts near our best guess and keeps playing. Move back or forward if you need to."
    : source.widened ? ""
    : source.approx ? "This clip is our best guess at the part the Q&A comes from. Move back or forward a little if you need to."
    : "This clip is the part of the video the Q&A comes from.";
  const unverifiable = scores.qa_alignment?.sourceUnverifiable === true;
  const sourceCheck = `
        <label class="source-check">
          <input id="source-unverifiable" type="checkbox" ${unverifiable ? "checked" : ""} />
          <span>Video won’t play (skip this question)</span>
        </label>`;
  return `
    <div class="source-materials">
      ${source ? `
      <p class="source-instruction">After you answer <strong>${qNum("qa_standalone")}</strong>, <strong>watch the ${source.hasClip ? "video clip" : "video"} below</strong>. You need it for <strong>${qNum("qa_alignment")}</strong>.</p>
      <details class="source-video" id="source-video-panel" ${openVideo ? "open" : ""}>
        <summary><span class="video-action-show">Show the ${source.hasClip ? "video clip" : "video"}</span><span class="video-action-hide">Hide the ${source.hasClip ? "video clip" : "video"}</span>${source.timeLabel ? ` — ${source.approx ? "about " : ""}${source.timeLabel}` : ""}</summary>
        <p><a class="vidlink-inline" href="${escapeAttr(source.url)}" target="_blank" rel="noopener noreferrer">Video not loading? Open YouTube app</a></p>
        ${source.embed ? `<iframe class="video-frame" id="source-video-player" src="${escapeAttr(source.embed)}" title="Source video" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>` : ""}
        ${clipNote ? `<p class="muted" style="margin:8px 0 0 0;">${clipNote}</p>` : ""}
        ${sourceCheck}
      </details>
      ` : `<p class="source-instruction">After you answer <strong>${qNum("qa_standalone")}</strong>, read the transcript below.</p>
      ${sourceCheck}`}
      ${sourceTranscript(pair)}
    </div>`;
}

function firstUnansweredStep(metrics, scores) {
  const index = metrics.findIndex((m) => !completeMetric(scores[m.key], m));
  return index === -1 ? metrics.length : index;
}

function setSourceUnverifiable(unavailable) {
  const state = metricState(S.uids[S.index], "qa_alignment");
  state.sourceUnverifiable = unavailable === true;
  const block = app.querySelector('.metric[data-key="qa_alignment"]');
  if (block) {
    block.querySelector("[data-trust-controls]").hidden = state.sourceUnverifiable;
    if (state.sourceUnverifiable && dictation && block.contains(dictation.ta)) stopDictation();
  }
  const status = document.getElementById("source-not-assessed");
  if (status) status.hidden = !state.sourceUnverifiable;
  setRateErr("");
  save();
  updateRatingProgress();
}

function setMetricAnswer(key, answer) {
  const metric = METRICS.find((m) => m.key === key);
  if (!metric || !answerChoices(metric).includes(answer)) return;
  const state = metricState(S.uids[S.index], key);
  state[answerField(metric)] = answer;

  const concernBox = metric.concernChoices ? document.getElementById("safety-concern-box") : null;
  if (concernBox) {
    concernBox.hidden = !showsConcern(metric, answer);
    if (concernBox.hidden && dictation && concernBox.contains(dictation.ta)) stopDictation();
  }
  setRateErr("");
  // Let reviewers answer the standalone question before displaying the video.
  if (METRICS_BEFORE_VIDEO.includes(key)) {
    const videoPanel = document.getElementById("source-video-panel");
    if (videoPanel && !videoPanel.open) videoPanel.open = true;
  }
  save();
  updateRatingProgress();
}

/* ===========================================================================
   Dictation (speech to text) for every text box
   ===========================================================================
   Uses the browser's built-in speech recognition (Chrome, Edge, Safari). In
   browsers without it (Firefox) no mic button is shown. Spoken text is added
   at the end of what is already in the box and goes through the box's normal
   "input" handler, so it is saved exactly like typed text. */
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
const MIC_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg>';
let dictation = null;  // { rec, ta, btn, status }

function stopDictation() {
  if (!dictation) return;
  const d = dictation;
  dictation = null;
  try { d.rec.stop(); } catch (e) { /* already stopped */ }
  d.btn.classList.remove("on");
  d.btn.setAttribute("aria-pressed", "false");
  d.btn.title = "Dictate with your microphone";
  if (d.status.textContent === "Listening… speak now, click the mic again to stop.") d.status.textContent = "";
}

function startDictation(ta, btn, status) {
  stopDictation();
  const rec = new SpeechRec();
  rec.lang = navigator.language || "en-US";
  rec.continuous = true;
  rec.interimResults = true;
  // Text already in the box stays; dictated phrases are appended after it.
  let base = ta.value;
  const join = (a, b) => (a && b && !/\s$/.test(a) ? a + " " : a) + b;
  rec.onresult = (ev) => {
    let interim = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const text = ev.results[i][0].transcript.trim();
      if (ev.results[i].isFinal) base = join(base, text);
      else interim = join(interim, text);
    }
    ta.value = join(base, interim);
    ta.dispatchEvent(new Event("input", { bubbles: true }));
  };
  rec.onerror = (ev) => {
    status.textContent = ev.error === "not-allowed" || ev.error === "service-not-allowed"
      ? "The microphone is blocked. Allow it in the address bar, or type instead."
      : ev.error === "no-speech" ? "No speech heard. Click the mic and try again." : "Dictation stopped (" + ev.error + ").";
  };
  rec.onend = () => { if (dictation && dictation.rec === rec) stopDictation(); };
  dictation = { rec, ta, btn, status };
  btn.classList.add("on");
  btn.setAttribute("aria-pressed", "true");
  btn.title = "Stop dictation";
  status.textContent = "Listening… speak now, click the mic again to stop.";
  try { rec.start(); } catch (e) { stopDictation(); status.textContent = "Could not start dictation. Type instead."; }
}

// Wraps every textarea under root with a mic button. Safe to call after each render.
function attachMics(root) {
  if (!SpeechRec) return;
  root.querySelectorAll("textarea").forEach((ta) => {
    if (ta.closest(".dictate")) return;
    const wrap = document.createElement("div");
    wrap.className = "dictate";
    ta.parentNode.insertBefore(wrap, ta);
    wrap.appendChild(ta);
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "mic-btn";
    btn.innerHTML = MIC_SVG;
    btn.title = "Dictate with your microphone";
    btn.setAttribute("aria-label", "Dictate into this box");
    btn.setAttribute("aria-pressed", "false");
    wrap.appendChild(btn);
    const status = document.createElement("div");
    status.className = "mic-status";
    status.setAttribute("aria-live", "polite");
    wrap.insertAdjacentElement("afterend", status);
    btn.addEventListener("click", () => {
      if (dictation && dictation.btn === btn) stopDictation();
      else { status.textContent = ""; startDictation(ta, btn, status); }
    });
  });
}

function setRecommendation(value) {
  const uid = S.uids[S.index];
  S.recommendations[uid] = value;
  const noteBox = document.getElementById("recommendation-note-box");
  if (noteBox) {
    noteBox.hidden = value !== "No";
    if (noteBox.hidden && dictation && noteBox.contains(dictation.ta)) stopDictation();
  }
  setRateErr("");
  save();
  updateRatingProgress();
}

function storeTime() {
  const uid = S.uids[S.index];
  if (shownAt) S.seconds[uid] = (S.seconds[uid] || 0) + Math.round((Date.now() - shownAt) / 1000);
  shownAt = Date.now();
}

function submitPair() {
  const uid = S.uids[S.index];
  const sc = S.scores[uid] || {};
  const missing = displayMetrics().filter((m) => !completeMetric(sc[m.key], m));
  if (missing.length) {
    setRateErr("Still to answer: " + missing.map((m) => qNum(m.key)).join(", ") + ".");
    const first = displayMetrics().findIndex((m) => m.key === missing[0].key);
    if (stepperOn()) { phoneStep = first; applyStep(true); }
    const el = app.querySelector('.metric[data-step="' + first + '"]');
    if (el) el.scrollIntoView({ block: "center", behavior: "smooth" });
    return;
  }
  if (!completeRecommendation(S.recommendations && S.recommendations[uid])) {
    setRateErr("Still to answer: question " + (displayMetrics().length + 1) + ".");
    if (stepperOn()) { phoneStep = displayMetrics().length; applyStep(false); }
    const recommendation = document.getElementById("recommendation");
    if (recommendation) recommendation.scrollIntoView({ block: "center", behavior: "smooth" });
    return;
  }
  storeTime();
  enqueue(uid);
  S.index += 1;
  save();
  renderRate();
}

// Error text under Submit, mirrored under the phone Back/Next buttons.
function setRateErr(text) {
  for (const id of ["rate-err", "step-err"]) {
    const el = document.getElementById(id);
    if (el) el.textContent = text;
  }
}

/* ---------------------------------------------------------------------------
   Phones: one question at a time. The same questions and actions are
   available on a computer; CSS hides the other steps on phones.
   Steps 0..n-1 are the display metrics, step n is the recommendation.
   --------------------------------------------------------------------------- */
const PHONE = window.matchMedia ? window.matchMedia("(max-width: 620px)") : null;
let phoneStep = 0;
function stepperOn() {
  return Boolean(PHONE && PHONE.matches && app.querySelector && app.querySelector(".rating-form"));
}

function updateAnswerToggle() {
  if (!PHONE?.matches) return;
  const toggle = document.getElementById("answer-toggle");
  if (!toggle || toggle.getAttribute("aria-expanded") === "true") return;
  const answer = document.getElementById("atext");
  toggle.hidden = answer.scrollHeight <= answer.clientHeight;
}

function updateRatingProgress() {
  const bar = document.getElementById("qa-progress");
  if (!bar) return;
  const metrics = displayMetrics();
  const scores = S.scores[S.uids[S.index]] || {};
  const step = stepperOn() ? phoneStep : firstUnansweredStep(metrics, scores);
  const counter = document.getElementById("question-progress");
  const label = "Question " + (step + 1) + " of " + (metrics.length + 1);
  if (counter.textContent !== label) counter.textContent = label;
  bar.value = ratedCount();
}

function applyStep(scroll) {
  const form = app.querySelector && app.querySelector(".rating-form");
  if (!form) return;
  const on = Boolean(PHONE && PHONE.matches);
  form.classList.toggle("stepper", on);
  const last = displayMetrics().length;
  phoneStep = Math.max(0, Math.min(last, phoneStep));
  form.querySelectorAll("[data-step]").forEach((el) => {
    el.classList.toggle("step-off", Number(el.dataset.step) !== phoneStep);
  });
  updateRatingProgress();
  const back = document.getElementById("step-back");
  back.textContent = phoneStep === 0 ? "← Previous Q&A" : "← Back";
  back.disabled = phoneStep === 0 && S.index === 0;
  const next = document.getElementById("step-next");
  next.textContent = phoneStep === last ? document.getElementById("next").textContent : "Next →";
  if (on && scroll) {
    const card = form.querySelector('[data-step="' + phoneStep + '"]');
    if (card) card.scrollIntoView({ block: "start", behavior: "smooth" });
  }
}

function goToStep(step) {
  setRateErr("");
  phoneStep = step;
  applyStep(true);
}

function stepNext() {
  const metric = displayMetrics()[phoneStep];
  if (!metric) return submitPair();
  const value = (S.scores[S.uids[S.index]] || {})[metric.key];
  if (!completeMetric(value, metric)) {
    setRateErr("Please choose an answer first.");
    return;
  }
  goToStep(phoneStep + 1);
}

function stepBack() {
  if (phoneStep > 0) return goToStep(phoneStep - 1);
  const prev = document.getElementById("prev");
  if (prev && !prev.disabled) prev.click();
}

if (PHONE) {
  window.addEventListener("resize", updateAnswerToggle);
  const onChange = () => { if (S && app.querySelector(".rating-form")) applyStep(false); };
  if (PHONE.addEventListener) PHONE.addEventListener("change", onChange);
  else if (PHONE.addListener) PHONE.addListener(onChange);
}

/* ===========================================================================
   Screen: done
   =========================================================================== */

function renderDone() {
  releaseSourcePlayer();
  const done = ratedCount();
  const complete = done === S.uids.length;

  app.innerHTML = `
    <div class="banner ${complete ? "banner-ok" : "banner-info"}">
      ${complete
        ? "<b>All done. Thank you!</b> You rated all your Q&As."
        : "<b>Your work is saved.</b> You rated " + done + " of " + S.uids.length + " Q&As. To finish, come back to this link and type the same name."}
    </div>

    <div class="card">
      <h2>Your progress</h2>
      <table>
        <tr><td>Name</td><td><b>${escapeAttr(S.annotator)}</b></td></tr>
        <tr><td>Q&As done</td><td class="num"><b>${done}</b> of ${S.uids.length}</td></tr>
      </table>
      <div class="sync" id="sync" style="margin-top:12px;"></div>
      ${backendOn ? '<p class="muted" style="margin-top:8px;">Your ratings go to the research team on their own. You do not need to download anything.</p>' : '<p class="muted" style="margin-top:8px;">Your ratings are only in this browser. <b>Please download them and send the file to the research team.</b></p>'}

      <div class="navbtns">
        <button class="${backendOn ? "btn-ghost" : "btn-primary"}" id="dl-csv">Download responses</button>
        ${done < S.uids.length ? '<button class="btn-ghost" id="resume">Continue rating</button>' : ""}
      </div>
    </div>`;

  document.getElementById("dl-csv").addEventListener("click", exportCsv);
  const resume = document.getElementById("resume");
  if (resume) resume.addEventListener("click", () => {
    const next = S.uids.findIndex((u) => !isRated(u));
    S.index = next === -1 ? S.uids.length : next;
    renderRate();
  });
  setSync(syncState);
  flush();
  window.scrollTo({ top: 0 });
}

/* ===========================================================================
   Boot
   =========================================================================== */

const loadJson = async (file) => {
  const data = window.EVAL_PREVIEW_DATA;
  if (data && Object.hasOwn(data, file)) return data[file];
  const r = await fetch(file);
  if (!r.ok) throw new Error(file + ": HTTP " + r.status);
  return r.json();
};
Promise.all([loadJson("qa_data.json"), loadJson("versions.json"), loadJson("transcripts.json").catch(() => ({}))])
  .then(([json, versions, transcripts]) => {
    const all = Array.isArray(json) ? json : (json.pairs || []);
    // Hard exclusion happens here, once, before anything else sees the corpus.
    DATA = all.filter((p) => !isExcluded(p.approach));
    VIDEOS = Array.isArray(json) ? {} : (json.videos || {});
    TRANSCRIPTS = transcripts && typeof transcripts === "object" ? transcripts : {};
    VERSIONS = versions.versions || {};
    PROVISIONAL = versions.provisional === true;
    if (PROVISIONAL) console.warn("v6: PROVISIONAL placeholder Q&A selection — testing only.");
    const known = new Set(DATA.map((p) => p.uid));
    const missing = Object.values(VERSIONS).flat().filter((u) => !known.has(u));
    // Versions come in batches of five (1-5, then 6-10, ...), numbered from 1.
    const numbers = Object.keys(VERSIONS).map(Number).sort((a, b) => a - b);
    const wholeBatches = numbers.length > 0 && numbers.length % 5 === 0 && numbers.every((n, i) => n === i + 1);
    const groups = Object.values(VERSIONS);
    const perGroup = versions.pairs_per_version || (groups[0] || []).length;
    const allUids = groups.flat();
    const completeGroups = Number.isInteger(perGroup) && perGroup > 0 && perGroup <= 20 &&
      groups.every((uids) => Array.isArray(uids) && uids.length === perGroup) &&
      new Set(allUids).size === allUids.length;
    if (!wholeBatches || !completeGroups || missing.length) {
      app.innerHTML = '<div class="card"><h2>Sorry, this page is not ready yet</h2>' +
        '<p>Please contact the research team.</p>' +
        '<details class="more-details"><summary>Details for the research team</summary>' +
        '<p class="muted">The Q&amp;A versions are incomplete. Check the matching data files in the v6 upload folder.</p></details></div>';
      return;
    }
    renderWelcome();
  })
  .catch((e) => {
    app.innerHTML = '<div class="card"><h2>Sorry, the Q&As did not load</h2>' +
      '<p>Please check your internet and reload the page. If it still does not work, contact the research team.</p>' +
      '<details class="more-details"><summary>Details for the research team</summary>' +
      '<p class="muted">' + escapeAttr(String(e)) + '</p>' +
      '<p class="muted">Upload the complete v6 site folder. For local testing, serve the folder over HTTP ' +
      '(<code>python -m http.server</code>) rather than opening the file directly — <code>file://</code> blocks the fetch.</p></details></div>';
  });
</script>
