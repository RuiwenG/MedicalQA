<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Dementia Q&A — Human Evaluation</title>
<style>
  :root {
    color-scheme: light;
    --navy: #1e3a5f;
    --navy-2: #2c4d7a;
    --ink: #1a1f2e;
    --muted: #5a6478;
    --line: #e3e7ee;
    --bg: #f7f8fb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: var(--bg);
    font-size: 14px;
    line-height: 1.55;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 20px; }

  header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%);
    color: white;
    padding: 18px 24px;
    border-radius: 10px;
    margin-bottom: 16px;
  }
  header h1 { margin: 0 0 4px 0; font-size: 18px; font-weight: 600; letter-spacing: 0.2px; }
  header .sub { font-size: 13px; opacity: 0.85; }

  .card {
    background: white;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }
  h2 { font-size: 15px; margin: 0 0 10px 0; color: var(--navy); }
  h3 { font-size: 13px; margin: 18px 0 8px 0; color: var(--navy); text-transform: uppercase; letter-spacing: 0.5px; }
  p { margin: 0 0 10px 0; }
  .muted { color: var(--muted); font-size: 13px; }
  ul { margin: 0 0 10px 0; padding-left: 20px; }
  li { margin-bottom: 4px; }

  label.field { display: block; font-weight: 600; font-size: 13px; margin-bottom: 5px; }
  input[type=text], input[type=number], textarea {
    font-family: inherit; font-size: 14px;
    padding: 9px 12px; border: 1px solid #d6dae3; border-radius: 8px;
    background: white; color: var(--ink);
  }
  input[type=text], input[type=number] { width: 100%; max-width: 340px; }
  textarea { width: 100%; box-sizing: border-box; min-height: 96px; resize: vertical; line-height: 1.45; }
  input[type=text]:focus, input[type=number]:focus, textarea:focus { outline: 2px solid #6b8cae; outline-offset: -1px; }

  button {
    font-family: inherit; font-size: 14px; font-weight: 500;
    padding: 10px 20px; border-radius: 8px; border: 1px solid transparent;
    cursor: pointer; transition: background 0.15s, border-color 0.15s;
  }
  .btn-primary { background: var(--navy); color: white; }
  .btn-primary:hover { background: var(--navy-2); }
  .btn-primary:disabled { background: #9aa4b5; cursor: not-allowed; }
  .btn-ghost { background: white; color: var(--muted); border-color: #d6dae3; }
  .btn-ghost:hover { border-color: #6b8cae; color: var(--navy); }
  .btn-ghost:disabled { opacity: 0.45; cursor: not-allowed; }

  .banner {
    border-radius: 8px; padding: 11px 14px; margin-bottom: 14px; font-size: 13px;
  }
  .banner-warn { background: #fff3cd; border-left: 4px solid #ff9800; color: #7a5b00; }
  .banner-info { background: #e7f1fb; border-left: 4px solid #4da6ff; color: #1c4a75; }
  .banner-ok   { background: #d4edda; border-left: 4px solid #28a745; color: #155724; }

  /* --- progress --------------------------------------------------------- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: rgba(247,248,251,0.94); backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line); margin-bottom: 14px;
    padding: 10px 0 8px 0;
  }
  .topbar-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap; font-size: 13px;
  }
  .progress-track { height: 6px; background: #e3e7ee; border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--navy), #4da6ff); width: 0%; transition: width 0.25s; }
  .sync { font-size: 12px; display: inline-flex; align-items: center; gap: 5px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #9aa4b5; display: inline-block; }
  .dot.ok { background: #28a745; }
  .dot.pending { background: #ff9800; }
  .dot.off { background: #9aa4b5; }
  .dot.err { background: #d9534f; }

  /* --- Q&A -------------------------------------------------------------- */
  .qa-meta { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .qa-meta code {
    font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11px;
    background: #f0f2f7; padding: 1px 6px; border-radius: 4px;
  }
  .qbox, .abox {
    padding: 14px 16px; border-radius: 8px; margin-bottom: 10px;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .qbox { background: #fff3cd; border-left: 4px solid #ff9800; }
  .abox { background: #d4edda; border-left: 4px solid #28a745; max-height: 420px; overflow-y: auto; }
  .box-label {
    display: block; font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.6px; margin-bottom: 6px;
  }
  .qbox .box-label { color: #856404; }
  .abox .box-label { color: #155724; }
  .box-text { font-size: 15px; color: #2a2f3a; }

  /* --- metrics ---------------------------------------------------------- */
  .metric {
    border: 1px solid var(--line); border-left: 4px solid #cfd6e2;
    border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; background: white;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .metric.active { border-left-color: #4da6ff; box-shadow: 0 0 0 2px rgba(77,166,255,0.18); }
  .metric.rated { border-left-color: #28a745; }
  .metric-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .metric-name { font-weight: 600; color: var(--navy); font-size: 14px; }
  .tag {
    color: white; border-radius: 10px; padding: 1px 8px; font-size: 11px; font-weight: 600;
  }
  .tag.q { background: #856404; }
  .tag.a { background: #155724; }
  .tag.qa { background: #2c5aa0; }
  .metric-def { color: var(--muted); font-size: 12.5px; font-style: italic; margin: 4px 0 10px 0; }

  .likert { display: flex; gap: 6px; flex-wrap: wrap; }
  .likert button {
    flex: 1 1 0; min-width: 92px; padding: 8px 6px; font-size: 12px; font-weight: 500;
    background: white; border: 1px solid #d6dae3; color: #4a5366; line-height: 1.3;
  }
  .likert button:hover { border-color: #6b8cae; color: var(--navy); }
  .likert button.sel { background: var(--navy); border-color: var(--navy); color: white; }
  .likert .num { display: block; font-size: 15px; font-weight: 700; }
  .rating-subhead { color: var(--navy); font-size: 12px; font-weight: 700; margin: 10px 0 5px; }
  .error-panel { margin-top: 8px; }
  .error-panel[hidden] { display: none; }
  .source-video { overflow: hidden; }
  .source-video summary { cursor: pointer; color: var(--navy); font-weight: 700; margin-bottom: 8px; }
  .video-frame {
    width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 8px;
    background: #111; display: block;
  }

  .navbtns { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 16px; }
  .navbtns .spacer { flex: 1; }
  .err { color: #d9534f; font-size: 13px; font-weight: 500; }

  details.adv { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 14px; }
  details.adv summary { cursor: pointer; font-weight: 600; font-size: 13px; color: var(--navy); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px 14px; margin: 8px 0 4px 0; }
  .chk { display: flex; align-items: center; gap: 7px; font-size: 13px; }
  .chk input { margin: 0; width: 15px; height: 15px; }

  /* video picker — one compact chip per video, grouped by dataset */
  .ds-group { margin-bottom: 12px; }
  .ds-group-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .ds-group-head b { font-size: 13px; color: var(--navy); }
  .vidgrid { display: flex; flex-wrap: wrap; gap: 6px; }
  .vidchk {
    display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
    border: 1px solid #d6dae3; border-radius: 6px; padding: 4px 9px;
    font-size: 12.5px; background: white; user-select: none;
  }
  .vidchk:hover { border-color: #6b8cae; }
  .vidchk input { margin: 0; width: 13px; height: 13px; }
  .vidchk.on { background: #eef4fb; border-color: #6b8cae; color: var(--navy); font-weight: 500; }
  .vidwrap { display: inline-flex; align-items: center; gap: 2px; }
  .vidlink {
    text-decoration: none; color: #9aa4b5; font-size: 11px; padding: 3px 4px;
    border-radius: 4px; line-height: 1;
  }
  .vidlink:hover { color: #c4302b; background: #f5f5f5; }
  .vidlink-inline {
    color: var(--navy); text-decoration: none; font-weight: 500; white-space: nowrap;
    border: 1px solid #d6dae3; border-radius: 6px; padding: 3px 10px; background: white;
  }
  .vidlink-inline:hover { border-color: #6b8cae; background: #eef4fb; }
  .qa-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .minibtn {
    font-size: 11px; padding: 3px 9px; border-radius: 6px;
    background: white; border: 1px solid #d6dae3; color: var(--muted); font-weight: 500;
  }
  .minibtn:hover { border-color: #6b8cae; color: var(--navy); }
  .selection-note {
    background: #eef4fb; border: 1px solid #cfe0f2; border-radius: 8px;
    padding: 9px 13px; margin-top: 12px; font-size: 13px; color: #1c4a75;
  }
  .inline-fields { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; }
  .inline-fields > div { min-width: 130px; }
  .inline-fields input { max-width: 130px; }

  table { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 8px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

  kbd {
    font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11px;
    background: #f0f2f7; border: 1px solid #d6dae3; border-bottom-width: 2px;
    border-radius: 4px; padding: 1px 5px; color: var(--muted);
  }
  .hidden { display: none !important; }
  @media (max-width: 620px) {
    .wrap { padding: 12px; }
    .likert button { min-width: 60px; font-size: 11px; }
    .likert button .lbl { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>Dementia Q&A — Human Evaluation</h1>
  <div class="sub">Rating the educational value of automatically generated Q&As from dementia-care videos.</div>
</header>

<div id="app"><div class="card"><p class="muted">Loading Q&As…</p></div></div>

</div>

<script src="config.js"></script>
<script>
"use strict";

/* ===========================================================================
   Configuration + metric definitions
   =========================================================================== */

const CFG = Object.assign({
  SUPABASE_URL: "", SUPABASE_ANON_KEY: "",
  RATINGS_TABLE: "ratings_ui_v2_qna_v2",
  STUDY_VERSION: "ui_v2_qna_v2",
  MAX_PAIRS: 0,
  // Approach names dropped from the corpus at load time. Excluded pairs never
  // reach DATA, so they cannot appear in the shared ordered set, in the
  // advanced picker, or in any count. qa_data.json itself is left untouched.
  EXCLUDE_APPROACHES: [],
}, window.EVAL_CONFIG || {});

// Normalised for comparison so a stray "dualagent" or " RAG " in config still
// matches the approach names recorded in qa_data.json.
const EXCLUDED = new Set(
  (CFG.EXCLUDE_APPROACHES || []).map((a) => String(a).trim().toLowerCase()));
const isExcluded = (approach) => EXCLUDED.has(String(approach).trim().toLowerCase());

// Tolerate the two easy paste mistakes: a trailing slash, and copying the REST
// endpoint (".../rest/v1") instead of the bare project URL. Both would
// otherwise produce a 404 on every insert with no obvious cause.
const SUPABASE_ORIGIN = String(CFG.SUPABASE_URL || "")
  .trim()
  .replace(/\/+$/, "")
  .replace(/\/rest\/v1$/, "");
const RATINGS_TABLE = String(CFG.RATINGS_TABLE || "ratings_ui_v2_qna_v2").trim();

// key   -> column name in Supabase / CSV field key
// label -> what the annotator reads
// scope -> which part of the pair is being judged, drives the coloured tag
const METRICS = [
  { key: "qa_alignment", dbPrefix: "qna_trustworthiness", label: "Q&A Trustworthiness", scope: "qa",
    attributeName: "Q&A Trustworthiness",
    binaryQuestion: "Does the Q&A align with the video?",
    def: "The answer directly addresses the question, is supported by the source video, and does not add unsupported claims or contradict the video.",
    attribute: [
      "Excellent",
      "Good",
      "Fair",
      "Poor",
    ],
    errors: ["Source Misinterpretation", "Hallucinating", "Contradiction", "Missing Key Information"],
    noIssueError: "No issue" },
  { key: "qa_accessibility", dbPrefix: "qna_clarity", label: "Q&A Clarity", scope: "qa",
    attributeName: "Q&A Clarity",
    binaryQuestion: "Is the Q&A easy for a caregiver to understand?",
    def: "The Q&A is specific, readable, and accessible for an 8th grade reader, without unexplained clinical or technical language.",
    attribute: [
      "Very easy to understand",
      "Easy",
      "Somewhat difficult",
      "Difficult",
    ],
    errors: ["Difficult vocabulary", "Too long", "Ambiguous", "Poor organization"],
    noIssueError: "No issue" },
  { key: "qa_edu_actionable", dbPrefix: "qna_usefulness", label: "Q&A Usefulness", scope: "qa",
    attributeName: "Q&A Usefulness",
    binaryQuestion: "Does the Q&A provide useful or actionable guidance for caregivers?",
    def: "The Q&A teaches an important dementia-care idea and/or gives practical guidance a caregiver could apply.",
    attribute: [
      "Highly useful",
      "Useful",
      "Limited useful",
      "Not useful",
    ],
    errors: ["Not actionable", "Missing Explanation", "Generic Advice", "Low Relevance to Caregiver Needs"],
    noIssueError: "No issue" },
  { key: "qa_mental_health", dbPrefix: "qna_care_safety", label: "Q&A Care Safety", scope: "qa",
    binaryQuestion: "Does the Q&A contain guidance that could lead to unsafe or inappropriate care?",
    def: "The Q&A should give safe and respectful guidance for caregivers and people living with dementia.",
    binaryOptions: ["Yes", "No"],
    errorTrigger: "Yes",
    errorPrompt: "If Yes, what is the concern? Select all that apply.",
    errors: ["Unsafe medical or health advice", "Physical safety risk", "Blaming or judgmental language", "Discourages professional care"],
    noIssueError: "No issue" },
];

const NO_PROBLEM = "No issue";
const BINARY = ["Yes", "No"];
const LEGACY_PROBLEM_VALUES = ["__needs_severity__", "Minor", "Moderate", "Severe"];

const RECOMMENDATION = [
  "Yes",
  "Yes, but with minor edits (meaning unchanged)",
  "No, it needs major edits",
  "No",
];

const SCOPE_TAG = { q: "Question", a: "Answer", qa: "Q&A" };

/* ===========================================================================
   Deterministic helpers.
   =========================================================================== */

// FNV-1a, used for stable local session ids.
function hashStr(s) {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h >>> 0;
}

const slug = (s) => (s || "anonymous").trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "anonymous";
const qaIndex = (p) => {
  const match = String(p.uid || "").match(/_q(\d+)$/);
  return match ? Number(match[1]) : Number.MAX_SAFE_INTEGER;
};
const pairSort = (a, b) =>
  qaIndex(a) - qaIndex(b)
  || a.video - b.video
  || a.dataset.localeCompare(b.dataset)
  || a.approach.localeCompare(b.approach)
  || a.uid.localeCompare(b.uid);

/* ===========================================================================
   State
   =========================================================================== */

let DATA = [];            // every Q&A from qa_data.json
let VIDEOS = {};          // { dataset: { video: { url, language } } } from the dataset CSVs
let S = null;             // the live session (see makeSession)
let activeMetric = 0;     // index into S.metrics, for keyboard rating
let shownAt = 0;          // timestamp the current pair appeared
let syncState = "off";    // off | ok | pending | err

const app = document.getElementById("app");
const params = new URLSearchParams(location.search);
const backendOn = Boolean(SUPABASE_ORIGIN && CFG.SUPABASE_ANON_KEY);

/* ===========================================================================
   Session construction
   =========================================================================== */

/**
 * Build the list of pairs this annotator will rate.
 *
 * Auto mode: every annotator receives the same ordered Q&A set. If MAX_PAIRS is
 * set, everybody receives the same first N pairs from that ordered set.
 *
 * Custom mode: the notebook's behaviour — filter, then sample N per
 * (dataset, video, approach) group.
 */
function buildPairs(opts) {
  let pool = DATA.filter((p) =>
    opts.datasets.includes(p.dataset) && opts.approaches.includes(p.approach));

  // opts.videos is a list of "<dataset>|<video>" keys the annotator picked by
  // hand. Automatic mode always uses the shared ordered corpus.
  if (opts.mode === "custom" && opts.videos) {
    const wanted = new Set(opts.videos);
    pool = pool.filter((p) => wanted.has(p.dataset + "|" + p.video));
  }

  if (opts.mode === "custom") {
    if (opts.sample > 0) {
      const groups = new Map();
      for (const p of pool) {
        const k = p.dataset + "|" + p.video + "|" + p.approach;
        if (!groups.has(k)) groups.set(k, []);
        groups.get(k).push(p);
      }
      pool = [];
      for (const k of [...groups.keys()].sort()) {
        const picked = groups.get(k).slice().sort(pairSort).slice(0, opts.sample);
        pool.push(...picked);
      }
    }
    return pool.slice().sort(pairSort);
  }

  let session = pool.slice().sort(pairSort);
  if (opts.maxPairs > 0) session = session.slice(0, opts.maxPairs);
  return session;
}

function makeSession(name, opts) {
  const pairs = buildPairs(opts);
  const configId = hashStr(JSON.stringify({
    m: opts.mode, d: opts.datasets, a: opts.approaches, v: opts.videos,
    sm: opts.sample, mx: opts.maxPairs, order: "same-ordered-v1",
  })).toString(36);

  return {
    version: 5,
    annotator: name,
    storeKey: "dqa:" + slug(name) + ":" + configId,
    sessionId: slug(name) + "-" + configId,
    opts: opts,
    metrics: opts.metrics,
    uids: pairs.map((p) => p.uid),
    index: 0,
    scores: {},        // uid -> { metricKey: { attribute, errors, binary } }
    recommendations: {}, // uid -> caregiver recommendation label
    comments: {},      // uid -> optional evaluator note
    seconds: {},       // uid -> seconds spent
    queue: [],         // rows waiting to reach Supabase
    startedAt: new Date().toISOString(),
  };
}

function save() {
  if (!S) return;
  try {
    localStorage.setItem(S.storeKey, JSON.stringify(S));
  } catch (e) {
    console.warn("localStorage write failed", e);
  }
}

function restore(storeKey) {
  try {
    const raw = localStorage.getItem(storeKey);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (!obj || obj.version !== 4) return null;
    obj.scores = obj.scores || {};
    obj.recommendations = obj.recommendations || {};
    obj.comments = obj.comments || {};
    obj.seconds = obj.seconds || {};
    obj.queue = obj.queue || [];
    // A session saved before an approach was excluded still lists its uids.
    // Drop them here rather than letting pairOf() return undefined mid-session,
    // and pull the cursor back so it cannot point past the shortened list.
    if (EXCLUDED.size && Array.isArray(obj.uids)) {
      const kept = obj.uids.filter((uid) => DATA.some((p) => p.uid === uid));
      if (kept.length !== obj.uids.length) {
        if (!kept.length) return null;
        obj.uids = kept;
        obj.index = Math.min(obj.index || 0, kept.length - 1);
      }
    }
    return obj;
  } catch (e) {
    return null;
  }
}

const pairOf = (uid) => DATA.find((p) => p.uid === uid);

/**
 * Link to the source video on YouTube, or null if the dataset CSV had no URL.
 */
function videoLink(p, withTimestamp) {
  const v = (VIDEOS[p.dataset] || {})[String(p.video)];
  if (!v || !v.url) return null;
  if (!withTimestamp || typeof p.t !== "number") return v.url;
  return v.url + (v.url.includes("?") ? "&" : "?") + "t=" + Math.max(0, p.t) + "s";
}

function videoLinkFor(dataset, video) {
  const v = (VIDEOS[dataset] || {})[String(video)];
  return v && v.url ? v.url : null;
}

function youtubeId(url) {
  try {
    const u = new URL(url);
    const host = u.hostname.replace(/^www\./, "");
    if (host === "youtu.be") return u.pathname.split("/").filter(Boolean)[0] || null;
    if (host.endsWith("youtube.com")) {
      if (u.searchParams.get("v")) return u.searchParams.get("v");
      const parts = u.pathname.split("/").filter(Boolean);
      if (["embed", "shorts", "live"].includes(parts[0])) return parts[1] || null;
    }
  } catch (e) {
    return null;
  }
  return null;
}

function sourceVideo(p) {
  const v = (VIDEOS[p.dataset] || {})[String(p.video)];
  if (!v || !v.url) return null;
  const id = youtubeId(v.url);
  if (!id) return { url: v.url, embed: null, hasClip: false };
  const hasClip = typeof p.t === "number";
  const start = hasClip ? Math.max(0, Math.round(p.t)) : 0;
  const end = hasClip && typeof p.te === "number" && p.te > p.t ? Math.round(p.te) : null;
  const params = new URLSearchParams({ rel: "0", modestbranding: "1", start: String(start) });
  if (end) params.set("end", String(end));
  return {
    url: videoLink(p, true),
    embed: `https://www.youtube.com/embed/${id}?${params.toString()}`,
    hasClip,
  };
}

function escapeAttr(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function completeBinary(value) {
  return BINARY.includes(value);
}

function binaryOptions(metric) {
  return metric && Array.isArray(metric.binaryOptions) ? metric.binaryOptions : BINARY;
}

function errorTrigger(metric) {
  return metric && metric.errorTrigger ? metric.errorTrigger : "No";
}

function clearChoice(metric) {
  return errorTrigger(metric) === "Yes" ? "No" : "Yes";
}

function needsErrorSelection(value, metric) {
  return binaryValue(value) === errorTrigger(metric);
}

function binaryValue(value) {
  if (!value || typeof value !== "object") return null;
  if (completeBinary(value.binary)) return value.binary;
  if (value.severity === NO_PROBLEM) return "Yes";
  if (LEGACY_PROBLEM_VALUES.includes(value.severity)) return "No";
  return null;
}

function completeRecommendation(value) {
  return RECOMMENDATION.includes(value);
}

function selectedErrors(value) {
  if (Array.isArray(value)) return value.filter(Boolean);
  if (typeof value === "string" && value && value !== NO_PROBLEM) {
    return value.split(";").map((v) => v.trim()).filter(Boolean);
  }
  return [];
}

function metricState(uid, key) {
  const row = S.scores[uid] || (S.scores[uid] = {});
  if (!row[key] || typeof row[key] !== "object") row[key] = {};
  if (typeof row[key].error === "string" && !Array.isArray(row[key].errors)) {
    row[key].errors = selectedErrors(row[key].error);
  }
  if (!row[key].binary && row[key].severity) {
    row[key].binary = row[key].severity === NO_PROBLEM ? "Yes" : "No";
  }
  return row[key];
}

function completeMetric(value, metric) {
  if (!value) return false;
  if (hasAttributeScale(metric) && (typeof value.attribute !== "string" || !value.attribute.length)) return false;
  const binary = binaryValue(value);
  if (!completeBinary(binary)) return false;
  return binary !== errorTrigger(metric) || selectedErrors(value.errors || value.error).length > 0;
}

function hasAttributeScale(metric) {
  return Boolean(metric && Array.isArray(metric.attribute) && metric.attribute.length > 0);
}

function dbPrefix(metric) {
  return metric && metric.dbPrefix ? metric.dbPrefix : metric.key;
}

function errorText(value, metric) {
  if (!value) return "";
  if (!needsErrorSelection(value, metric)) return metric.noIssueError;
  return selectedErrors(value.errors || value.error).join("; ");
}

const isRated = (uid) => {
  const sc = S.scores[uid];
  return Boolean(sc) &&
    S.metrics.every((k) => {
      const metric = METRICS.find((m) => m.key === k);
      return completeMetric(sc[k], metric);
    }) &&
    completeRecommendation(S.recommendations && S.recommendations[uid]);
};
const ratedCount = () => S.uids.filter(isRated).length;

/* ===========================================================================
   Supabase sync — fire and forget, with a persisted retry queue.
   The page never reads from the database; resume comes from localStorage.
   =========================================================================== */

function enqueue(uid) {
  const p = pairOf(uid);
  const sc = S.scores[uid] || {};
  const row = {
    study_version: CFG.STUDY_VERSION || "ui_v2_qna_v2",
    session_id: S.sessionId,
    annotator: S.annotator,
    qa_uid: uid,
    dataset: p.dataset,
    video: p.video,
    approach: p.approach,
    question_text: p.question,
    answer_text: p.answer,
    source_start_sec: typeof p.t === "number" ? p.t : null,
    source_end_sec: typeof p.te === "number" ? p.te : null,
    batch: S.opts.mode === "auto" ? "same-ordered-set" : "custom",
    blind: S.opts.blind,
    seconds_spent: S.seconds[uid] || null,
    client_time: new Date().toISOString(),
  };
  for (const m of METRICS) {
    const ms = sc[m.key] || {};
    const prefix = dbPrefix(m);
    if (hasAttributeScale(m)) row[prefix + "_attribute"] = completeMetric(ms, m) ? ms.attribute : null;
    row[prefix + "_issue"] = completeMetric(ms, m) ? errorText(ms, m) : null;
    row[prefix + "_binary"] = completeMetric(ms, m) ? ms.binary : null;
  }
  row.caregiver_recommendation = completeRecommendation(S.recommendations[uid])
    ? S.recommendations[uid]
    : null;
  const evaluatorComment = S.comments && S.comments[uid] ? S.comments[uid].trim() : "";
  if (evaluatorComment) row.evaluator_comment = evaluatorComment;

  // One row per pair in the queue; a re-rated pair replaces its pending row.
  S.queue = S.queue.filter((r) => r.qa_uid !== uid);
  S.queue.push(row);
  save();
  flush();
}

function normalizeSupabaseRow(row) {
  const p = pairOf(row.qa_uid) || {};
  const out = {
    study_version: row.study_version || CFG.STUDY_VERSION || "ui_v2_qna_v2",
    session_id: row.session_id,
    annotator: row.annotator,
    qa_uid: row.qa_uid,
    dataset: row.dataset,
    video: row.video,
    approach: row.approach,
    question_text: row.question_text || p.question || "",
    answer_text: row.answer_text || p.answer || "",
    source_start_sec: row.source_start_sec ?? (typeof p.t === "number" ? p.t : null),
    source_end_sec: row.source_end_sec ?? (typeof p.te === "number" ? p.te : null),
    batch: row.batch || null,
    blind: row.blind !== undefined ? row.blind : true,
    caregiver_recommendation: row.caregiver_recommendation || null,
    evaluator_comment: row.evaluator_comment || null,
    seconds_spent: row.seconds_spent || null,
    client_time: row.client_time || new Date().toISOString(),
  };

  for (const metric of METRICS) {
    const prefix = dbPrefix(metric);
    if (hasAttributeScale(metric)) {
      out[prefix + "_attribute"] = row[prefix + "_attribute"] ?? row[metric.key + "_attribute"] ?? null;
    }
    out[prefix + "_issue"] = row[prefix + "_issue"] ?? row[metric.key + "_error"] ?? null;
    out[prefix + "_binary"] = row[prefix + "_binary"] ?? row[metric.key + "_binary"] ?? null;
  }

  return out;
}

let flushing = false;
async function flush() {
  if (!backendOn || flushing || !S || S.queue.length === 0) {
    setSync(backendOn ? (S && S.queue.length ? "pending" : "ok") : "off");
    return;
  }
  flushing = true;
  setSync("pending");
  const batch = S.queue.slice(0, 25).map(normalizeSupabaseRow);
  try {
    const resp = await fetch(SUPABASE_ORIGIN + "/rest/v1/" + encodeURIComponent(RATINGS_TABLE), {
      method: "POST",
      headers: {
        "apikey": CFG.SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + CFG.SUPABASE_ANON_KEY,
        "Content-Type": "application/json",
        // return=minimal matters: asking for the inserted rows back would need
        // SELECT permission, which the insert-only policy deliberately denies.
        "Prefer": "return=minimal",
      },
      body: JSON.stringify(batch),
    });
    if (!resp.ok) throw new Error("HTTP " + resp.status + " " + (await resp.text()).slice(0, 200));
    S.queue = S.queue.slice(batch.length);
    save();
    setSync(S.queue.length ? "pending" : "ok");
    flushing = false;
    if (S.queue.length) flush();
  } catch (e) {
    console.warn("sync failed, will retry", e);
    setSync("err");
    flushing = false;
  }
}

function setSync(state) {
  syncState = state;
  const el = document.getElementById("sync");
  if (!el) return;
  const pending = S ? S.queue.length : 0;
  const map = {
    ok:      ["ok",      "All ratings saved"],
    pending: ["pending", pending + " waiting to save"],
    err:     ["err",     "Offline — " + pending + " saved locally, will retry"],
    off:     ["off",     "Local only — export at the end"],
  };
  const [cls, text] = map[state] || map.off;
  el.innerHTML = '<span class="dot ' + cls + '"></span>' + text;
}

// Retry whenever the network comes back or the tab is refocused.
window.addEventListener("online", flush);
document.addEventListener("visibilitychange", () => { if (!document.hidden) flush(); });
window.addEventListener("beforeunload", (e) => {
  if (S && S.queue.length && backendOn) { e.preventDefault(); e.returnValue = ""; }
});

// Same column names the notebook writes to Excel, so both sources aggregate together.
function metricCsvCols() {
  return METRICS.flatMap((m) => [
    m.label + " Attribute",
    m.label + " Error Type",
    m.label + " Yes/No",
  ]);
}

const CSV_COLS = ["Dataset", "Video Index", "Approach", "QA ID", "Question", "Answer"]
  .concat(metricCsvCols())
  .concat(["Caregiver Recommendation", "Evaluator Comment", "Annotator", "Session ID", "Assignment", "Seconds"]);

function csvCell(v) {
  const s = v === null || v === undefined ? "" : String(v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function buildCsv() {
  const lines = [CSV_COLS.join(",")];
  for (const uid of S.uids) {
    const p = pairOf(uid);
    const sc = S.scores[uid] || {};
    const row = [p.dataset, p.video, p.approach, uid, p.question, p.answer];
    for (const m of METRICS) {
      const ms = sc[m.key] || {};
      row.push(
        ms.attribute || "",
        errorText(ms, m),
        binaryValue(ms) || "",
      );
    }
    const recommendation = S.recommendations[uid];
    const comment = S.comments && S.comments[uid] ? S.comments[uid].trim() : "";
    row.push(completeRecommendation(recommendation) ? recommendation : "",
      comment,
      S.annotator, S.sessionId,
      S.opts.mode === "auto" ? "same-ordered-set" : "custom",
      S.seconds[uid] || "");
    lines.push(row.map(csvCell).join(","));
  }
  return lines.join("\r\n");
}

function download(filename, text, mime) {
  const blob = new Blob(["﻿" + text], { type: (mime || "text/plain") + ";charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function stamp() {
  const d = new Date(), p = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "_" + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
}

const exportCsv = () => download("qa_eval_" + slug(S.annotator) + "_" + stamp() + ".csv", buildCsv(), "text/csv");
const exportJson = () => download("qa_eval_" + slug(S.annotator) + "_" + stamp() + ".json",
  JSON.stringify({ annotator: S.annotator, session_id: S.sessionId, opts: S.opts,
                   metrics: S.metrics, scores: S.scores,
                   recommendations: S.recommendations, comments: S.comments,
                   seconds: S.seconds }, null, 1), "application/json");

        const sc = prev.scores[u];

          const metric = METRICS.find((m) => m.key === k);

          completeRecommendation(prev.recommendations && prev.recommendations[u]);

    const opts = readOpts(name);
    if (!opts.metrics.length) { err.textContent = "Select at least one metric."; return; }
    if (!opts.datasets.length || !opts.approaches.length) { err.textContent = "Select at least one dataset and one approach."; return; }
    if (opts.videos && !opts.videos.length) { err.textContent = "Select at least one video."; return; }

    const fresh = makeSession(name, opts);
    if (!fresh.uids.length) { err.textContent = "That selection contains no Q&As."; return; }
    saveLastOpts(opts, name);
    const prev = restore(fresh.storeKey);
    S = prev || fresh;
    // Resume at the first pair that still has an unrated metric.
    const next = S.uids.findIndex((u) => !isRated(u));
    S.index = next === -1 ? S.uids.length : next;
    save();
    flush();
    renderRate();
  });

  nameEl.addEventListener("keydown", (e) => { if (e.key === "Enter") document.getElementById("start").click(); });
}

function readOpts(name) {
  const q = (id) => document.getElementById(id);
  const vals = (cls) => [...document.querySelectorAll("." + cls)].filter((c) => c.checked).map((c) => c.value);
  const mode = (document.querySelector('input[name=mode]:checked') || {}).value || "auto";

  const allDs = [...new Set(DATA.map((p) => p.dataset))].sort();
  const allAp = [...new Set(DATA.map((p) => p.approach))].sort();

  return {
    mode: mode,
    datasets: mode === "custom" && document.querySelector(".ds") ? vals("ds") : allDs,
    approaches: mode === "custom" && document.querySelector(".ap") ? vals("ap") : allAp,
    // null means "every video" — automatic mode always spans the whole corpus.
    videos: mode === "custom" && document.querySelector(".vid") ? vals("vid") : null,
    metrics: document.querySelector(".mt") ? vals("mt") : METRICS.map((m) => m.key),
    blind: q("blind") ? q("blind").checked : true,
    batch: 0,
    batches: 1,
    anchorSize: 0,
    sample: Math.max(0, Number(q("sample") ? q("sample").value : 0) || 0),
    maxPairs: Math.max(0, Number(q("maxpairs") ? q("maxpairs").value : CFG.MAX_PAIRS) || 0),
  };
}

/* ===========================================================================
   Screen: rating
   =========================================================================== */

function optionButtons(key, field, options, selected) {
  return options.map((label) =>
    `<button type="button" data-key="${key}" data-field="${field}" data-value="${escapeAttr(label)}" class="${selected === label ? "sel" : ""}"><span class="num">${label}</span></button>`
  ).join("");
}

function errorButtons(key, options, selected) {
  const selectedSet = new Set(selectedErrors(selected));
  return options.map((label) =>
    `<button type="button" data-key="${key}" data-error="${escapeAttr(label)}" class="${selectedSet.has(label) ? "sel" : ""}"><span class="num">${label}</span></button>`
  ).join("");
}

function renderRate() {
  if (S.index >= S.uids.length) return renderDone();

  const uid = S.uids[S.index];
  const p = pairOf(uid);
  const sc = S.scores[uid] || (S.scores[uid] = {});
  const metrics = METRICS.filter((m) => S.metrics.includes(m.key));
  const done = ratedCount();
  const source = sourceVideo(p);
  shownAt = Date.now();

  app.innerHTML = `
    <div class="topbar">
      <div class="topbar-row">
        <div><b>Pair ${S.index + 1}</b> of ${S.uids.length} &nbsp;·&nbsp; <span class="muted">${done} fully rated</span></div>
        <div class="sync" id="sync"></div>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${(done / S.uids.length * 100).toFixed(1)}%"></div></div>
    </div>

    <div class="card">
      <div class="qa-meta">
        <span>Dataset <code>${p.dataset}</code> · Video <code>${p.video}</code> · System <code>${S.opts.blind ? "hidden" : p.approach}</code></span>
        ${source ? `<a class="vidlink-inline" href="${source.url}" target="_blank" rel="noopener noreferrer">Open source video</a>` : ""}
      </div>
      ${source ? `
      <details class="source-video" open>
        <summary>${source.hasClip ? "Source video clip for this Q&A" : "Source video"}</summary>
        ${source.embed ? `<iframe class="video-frame" src="${source.embed}" title="Source video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>` : `<a class="vidlink-inline" href="${source.url}" target="_blank" rel="noopener noreferrer">Open source video</a>`}
        <p class="muted" style="margin:8px 0 0 0; font-size:12px;">${source.hasClip ? "This clip starts at the Q&A source segment when timestamp metadata is available." : "Exact segment timestamps are unavailable for this Q&A output, so the full source video is shown."}</p>
      </details>` : ""}
      <div class="qbox"><span class="box-label">Question</span><span class="box-text" id="qtext"></span></div>
      <div class="abox"><span class="box-label">Answer</span><span class="box-text" id="atext"></span></div>
    </div>

    <div id="metrics">
      ${metrics.map((m, i) => {
        const ms = sc[m.key] && typeof sc[m.key] === "object" ? sc[m.key] : {};
        return `
        <div class="metric ${completeMetric(ms, m) ? "rated" : ""}" data-mi="${i}" data-key="${m.key}">
          <div class="metric-head">
            <span class="metric-name">${i + 1}. ${m.label}</span>
            <span class="tag ${m.scope}">${SCOPE_TAG[m.scope]}</span>
          </div>
          <div class="metric-def">${m.def}</div>
          ${hasAttributeScale(m) ? `
          <div class="rating-subhead">${m.attributeName}</div>
          <div class="likert">
            ${optionButtons(m.key, "attribute", m.attribute, ms.attribute)}
          </div>` : ""}
          <div class="rating-subhead">${m.binaryQuestion}</div>
          <div class="likert choice">
            ${binaryOptions(m).map((label) => `<button type="button" data-key="${m.key}" data-choice="${escapeAttr(label)}" class="${binaryValue(ms) === label ? "sel" : ""}"><span class="num">${label}</span></button>`).join("")}
          </div>
          <div class="error-panel" ${needsErrorSelection(ms, m) ? "" : "hidden"}>
            <div class="rating-subhead">${m.errorPrompt || "If No, what is wrong? Select all that apply."}</div>
            <div class="likert">
              ${errorButtons(m.key, m.errors, ms.errors || ms.error)}
            </div>
          </div>
        </div>`;
      }).join("")}
    </div>

    <div class="card metric ${completeRecommendation(S.recommendations[uid]) ? "rated" : ""}" id="recommendation">
      <div class="metric-head">
        <span class="metric-name">${metrics.length + 1}. Would you confidently recommend this Q&A to a caregiver?</span>
        <span class="tag qa">Overall</span>
      </div>
      <div class="metric-def">Use this as the final caregiver-facing judgment for the whole Q&A.</div>
      <div class="likert">
        ${RECOMMENDATION.map((label) => `<button type="button" data-recommend-v="${escapeAttr(label)}" class="${S.recommendations[uid] === label ? "sel" : ""}"><span class="num">${label}</span></button>`).join("")}
      </div>
    </div>

    <div class="card">
      <label class="field" for="qa-comment"><strong>Optional comment</strong></label>
      <p class="muted">Briefly explain why you rated this Q&A this way, or note anything the team should know.</p>
      <textarea id="qa-comment" placeholder="Write your comments about this Q&A here..."></textarea>
    </div>

    <div class="card">
      <div class="navbtns">
        <button class="btn-ghost" id="prev" ${S.index === 0 ? "disabled" : ""}>← Previous</button>
        <button class="btn-primary" id="next">Submit &amp; next →</button>
        <span class="spacer"></span>
        <button class="btn-ghost" id="options">⚙ Options</button>
        <button class="btn-ghost" id="finish">Finish / export</button>
      </div>
      <div class="err" id="rate-err" style="margin-top:8px;"></div>
      <p class="muted" style="margin-top:10px;">Keyboard: <kbd>Y</kbd> = Yes, <kbd>N</kbd> = No, <kbd>Enter</kbd> submits the pair.</p>
    </div>`;

  // textContent, not innerHTML — answers contain Markdown and raw punctuation
  // that must render literally (formatting noise is part of what is rated).
  document.getElementById("qtext").textContent = p.question;
  document.getElementById("atext").textContent = p.answer;
  document.getElementById("qa-comment").value = S.comments && S.comments[uid] ? S.comments[uid] : "";

  app.querySelectorAll("[data-field]").forEach((b) => {
    b.addEventListener("click", () => {
      const mi = Number(b.closest(".metric").dataset.mi);
      activeMetric = mi;
      setMetricField(b.dataset.key, b.dataset.field, b.dataset.value);
    });
  });

  app.querySelectorAll("[data-choice]").forEach((b) => {
    b.addEventListener("click", () => {
      const mi = Number(b.closest(".metric").dataset.mi);
      activeMetric = mi;
      setBinaryDecision(b.dataset.key, b.dataset.choice);
      const metric = METRICS.find((m) => m.key === b.dataset.key);
      const state = metricState(S.uids[S.index], b.dataset.key);
      if (completeMetric(state, metric)) {
        advanceMetric();
      }
    });
  });

  app.querySelectorAll("[data-error]").forEach((b) => {
    b.addEventListener("click", () => {
      const mi = Number(b.closest(".metric").dataset.mi);
      activeMetric = mi;
      toggleMetricError(b.dataset.key, b.dataset.error);
    });
  });

  app.querySelectorAll("[data-recommend-v]").forEach((b) => {
    b.addEventListener("click", () => setRecommendation(b.dataset.recommendV));
  });

  document.getElementById("qa-comment").addEventListener("input", (e) => setComment(e.target.value));

  document.getElementById("next").addEventListener("click", submitPair);
  document.getElementById("prev").addEventListener("click", () => {
    storeTime();
    S.index = Math.max(0, S.index - 1);
    save();
    renderRate();
  });
  // Back to the selection screen. Progress for this configuration stays in
  // localStorage, so returning with the same name and options resumes it.
  document.getElementById("options").addEventListener("click", () => {
    storeTime();
    if (isRated(uid)) enqueue(uid);
    save();
    renderWelcome();
  });

  document.getElementById("finish").addEventListener("click", () => {
    storeTime();
    // Push edits made on this pair before leaving; a partially rated pair is
    // deliberately not sent, it stays in localStorage until it is completed.
    if (isRated(uid)) enqueue(uid);
    save();
    renderDone();
  });

  activeMetric = metrics.findIndex((m) => !completeMetric(sc[m.key], m));
  if (activeMetric === -1) activeMetric = metrics.length - 1;
  paintActive();
  setSync(syncState);
  window.scrollTo({ top: 0 });
}

function paintActive() {
  app.querySelectorAll(".metric").forEach((el) => {
    const on = Number(el.dataset.mi) === activeMetric;
    el.classList.toggle("active", on);
  });
}

function setMetricField(key, field, value) {
  const uid = S.uids[S.index];
  const state = metricState(uid, key);
  state[field] = value;
  const metric = METRICS.find((m) => m.key === key);
  const block = app.querySelector('.metric[data-key="' + key + '"]');
  if (block) {
    block.classList.toggle("rated", completeMetric(state, metric));
    block.querySelectorAll('[data-field="' + field + '"]').forEach((b) => {
      b.classList.toggle("sel", b.dataset.value === String(value));
    });
  }
  document.getElementById("rate-err").textContent = "";
  save();
}

function setBinaryDecision(key, value) {
  const uid = S.uids[S.index];
  const state = metricState(uid, key);
  state.binary = value;
  delete state.severity;
  const metric = METRICS.find((m) => m.key === key);
  if (value === clearChoice(metric) && metric) {
    state.errors = [];
    state.error = metric.noIssueError;
  } else if (value === errorTrigger(metric) && state.error === (metric && metric.noIssueError)) {
    state.errors = [];
    delete state.error;
  }

  const block = app.querySelector('.metric[data-key="' + key + '"]');
  if (block) {
    block.classList.toggle("rated", completeMetric(state, metric));
    block.querySelectorAll("[data-choice]").forEach((b) => {
      b.classList.toggle("sel", b.dataset.choice === value);
    });
    const errorPanel = block.querySelector(".error-panel");
    if (errorPanel) errorPanel.hidden = value !== errorTrigger(metric);
    block.querySelectorAll("[data-error]").forEach((b) => b.classList.toggle("sel", selectedErrors(state.errors || state.error).includes(b.dataset.error)));
  }
  document.getElementById("rate-err").textContent = "";
  save();
  if (value === errorTrigger(metric) && !completeMetric(state, metric)) {
    document.getElementById("rate-err").textContent = metric && metric.errorTrigger === "Yes"
      ? "If you choose Yes, select at least one risk type."
      : "If you choose No, select at least one problem type.";
  }
}

function toggleMetricError(key, label) {
  const uid = S.uids[S.index];
  const state = metricState(uid, key);
  const errors = selectedErrors(state.errors || state.error);
  const idx = errors.indexOf(label);
  if (idx === -1) errors.push(label);
  else errors.splice(idx, 1);
  state.errors = errors;
  delete state.error;
  const metric = METRICS.find((m) => m.key === key);

  const block = app.querySelector('.metric[data-key="' + key + '"]');
  if (block) {
    block.classList.toggle("rated", completeMetric(state, metric));
    block.querySelectorAll("[data-error]").forEach((b) => {
      b.classList.toggle("sel", errors.includes(b.dataset.error));
    });
  }
  document.getElementById("rate-err").textContent = "";
  save();
}

function setRecommendation(value) {
  const uid = S.uids[S.index];
  S.recommendations[uid] = value;
  const block = document.getElementById("recommendation");
  if (block) {
    block.classList.toggle("rated", completeRecommendation(value));
    block.querySelectorAll("[data-recommend-v]").forEach((b) => {
      b.classList.toggle("sel", b.dataset.recommendV === value);
    });
  }
  document.getElementById("rate-err").textContent = "";
  save();
}

function setComment(value) {
  const uid = S.uids[S.index];
  if (!S.comments) S.comments = {};
  S.comments[uid] = value;
  save();
}

function advanceMetric() {
  const uid = S.uids[S.index];
  const sc = S.scores[uid] || {};
  const metrics = METRICS.filter((m) => S.metrics.includes(m.key));
  const current = metrics[activeMetric];
  if (current && !completeMetric(sc[current.key], current)) {
    paintActive();
    return;
  }
  if (activeMetric === metrics.length - 1) {
    paintActive();
    return;
  }
  const nextUnrated = metrics.findIndex((m, i) => i > activeMetric && !completeMetric(sc[m.key], m));
  if (nextUnrated !== -1) {
    activeMetric = nextUnrated;
  } else {
    const anyUnrated = metrics.findIndex((m) => !completeMetric(sc[m.key], m));
    if (anyUnrated !== -1) activeMetric = anyUnrated;
    else {
      paintActive();
      return;
    }
  }
  paintActive();
}

function storeTime() {
  const uid = S.uids[S.index];
  if (shownAt) S.seconds[uid] = (S.seconds[uid] || 0) + Math.round((Date.now() - shownAt) / 1000);
  shownAt = Date.now();
}

function submitPair() {
  const uid = S.uids[S.index];
  const sc = S.scores[uid] || {};
  const missing = METRICS.filter((m) => S.metrics.includes(m.key) && !completeMetric(sc[m.key], m));
  if (missing.length) {
    document.getElementById("rate-err").textContent = "Still to rate: " + missing.map((m) => m.label).join(", ");
    const first = METRICS.filter((m) => S.metrics.includes(m.key)).findIndex((m) => m.key === missing[0].key);
    activeMetric = first;
    paintActive();
    const el = app.querySelector('.metric[data-mi="' + first + '"]');
    if (el) el.scrollIntoView({ block: "center", behavior: "smooth" });
    return;
  }
  if (!completeRecommendation(S.recommendations && S.recommendations[uid])) {
    document.getElementById("rate-err").textContent = "Still to rate: caregiver recommendation.";
    const recommendation = document.getElementById("recommendation");
    if (recommendation) recommendation.scrollIntoView({ block: "center", behavior: "smooth" });
    return;
  }
  storeTime();
  enqueue(uid);
  S.index += 1;
  save();
  renderRate();
}

document.addEventListener("keydown", (e) => {
  if (!S || S.index >= S.uids.length) return;
  if (!document.getElementById("metrics")) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea") return;

  const metrics = METRICS.filter((m) => S.metrics.includes(m.key));
  const m = metrics[activeMetric];
  if (!m) return;

  if (e.key.toLowerCase() === "y") {
    setBinaryDecision(m.key, "Yes");
    const state = metricState(S.uids[S.index], m.key);
    if (completeMetric(state, m)) advanceMetric();
    e.preventDefault();
  } else if (e.key.toLowerCase() === "n") {
    setBinaryDecision(m.key, "No");
    const state = metricState(S.uids[S.index], m.key);
    if (completeMetric(state, m)) advanceMetric();
    e.preventDefault();
  } else if (e.key === "Enter") {
    submitPair();
    e.preventDefault();
  }
});

/* ===========================================================================
   Screen: done
   =========================================================================== */

function renderDone() {
  const done = ratedCount();
  const complete = done === S.uids.length;

  // Per-approach counts over what this annotator actually rated. Shown after the
  // fact only — during rating the approach stays hidden.
  const byApproach = {};
  for (const uid of S.uids) {
    if (!isRated(uid)) continue;
    const p = pairOf(uid);
    const b = byApproach[p.approach] || (byApproach[p.approach] = { n: 0 });
    b.n += 1;
  }

  app.innerHTML = `
    <div class="banner ${complete ? "banner-ok" : "banner-info"}">
      ${complete
        ? "<b>All done — thank you!</b> You rated every pair in your set."
        : "<b>Progress saved.</b> You rated " + done + " of " + S.uids.length + " pairs. Return to this link with the same name to carry on."}
    </div>

    <div class="card">
      <h2>Your session</h2>
      <table>
        <tr><td>Annotator</td><td><b>${S.annotator}</b></td></tr>
        <tr><td>Session ID</td><td><code>${S.sessionId}</code></td></tr>
        <tr><td>Assignment</td><td>${S.opts.mode === "auto" ? "same ordered set" : "custom subset"}</td></tr>
        <tr><td>Pairs fully rated</td><td class="num"><b>${done}</b> / ${S.uids.length}</td></tr>
      </table>
      <div class="sync" id="sync" style="margin-top:12px;"></div>
      ${backendOn ? "" : '<p class="muted" style="margin-top:8px;">No results server is configured, so <b>you must download your ratings and send them to the research team</b>, otherwise they are only in this browser.</p>'}

      <div class="navbtns">
        <button class="btn-primary" id="dl-csv">Download CSV</button>
        <button class="btn-ghost" id="dl-json">Download JSON</button>
        ${done < S.uids.length ? '<button class="btn-ghost" id="resume">Continue rating</button>' : ""}
        <span class="spacer"></span>
        <button class="btn-ghost" id="restart">Start a different session</button>
      </div>
    </div>

    ${Object.keys(byApproach).length ? `
    <div class="card">
      <h2>Rated pairs by system</h2>
      <p class="muted">Shown now that rating is finished. Score mapping happens later during analysis.</p>
      <div style="overflow-x:auto;">
      <table>
        <tr><th>System</th><th class="num">Rated pairs</th></tr>
        ${Object.entries(byApproach).sort().map(([a, b]) =>
          `<tr><td><b>${a}</b></td><td class="num">${b.n}</td></tr>`).join("")}
      </table>
      </div>
    </div>` : ""}`;

  document.getElementById("dl-csv").addEventListener("click", exportCsv);
  document.getElementById("dl-json").addEventListener("click", exportJson);
  const resume = document.getElementById("resume");
  if (resume) resume.addEventListener("click", () => {
    const next = S.uids.findIndex((u) => !isRated(u));
    S.index = next === -1 ? S.uids.length : next;
    renderRate();
  });
  document.getElementById("restart").addEventListener("click", () => {
    if (S.queue.length && !confirm("Some ratings have not reached the server yet. Download them first? Click Cancel to go back and download.")) return;
    S = null;
    renderWelcome();
  });
  setSync(syncState);
  flush();
  window.scrollTo({ top: 0 });
}

/* ===========================================================================
   Boot
   =========================================================================== */

fetch("qa_data.json")
  .then((r) => {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  })
  .then((json) => {
    // Accept the current {pairs, videos} shape and a bare array of pairs.
    const all = Array.isArray(json) ? json : (json.pairs || []);
    // Hard exclusion happens here, once, before anything else sees the corpus.
    DATA = all.filter((p) => !isExcluded(p.approach));
    VIDEOS = Array.isArray(json) ? {} : (json.videos || {});
    if (EXCLUDED.size) {
      console.info(`Excluded approaches: ${[...EXCLUDED].join(", ")} — ` +
        `${all.length - DATA.length} of ${all.length} pairs dropped, ${DATA.length} remain.`);
    }
    if (!DATA.length) {
      app.innerHTML = '<div class="card"><h2>No Q&As left</h2>' +
        '<p class="muted">Every pair was removed by <code>EXCLUDE_APPROACHES</code> in <code>config.js</code>.</p></div>';
      return;
    }
    renderWelcome();
  })
  .catch((e) => {
    app.innerHTML = '<div class="card"><h2>Could not load the Q&As</h2>' +
      '<p class="muted">' + String(e) + '</p>' +
      '<p class="muted">Regenerate the data file with <code>python eval/web/extract_qa_data.py</code>, and serve this folder over HTTP ' +
      '(<code>python -m http.server</code>) rather than opening the file directly — <code>file://</code> blocks the fetch.</p></div>';
  });
</script>
</body>
</html>
